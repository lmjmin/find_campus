<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>통합 검색 | FindCampus</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/search.css}">
</head>

<body>

<div th:replace="~{fragments/header :: header}"></div>

<div class="search-layout">

    <aside class="sidebar">

        <div class="search-panel-head">
            <div class="search-panel-icon">
                <i class="fa-solid fa-sliders"></i>
            </div>

            <div>
                <h2>상세 검색</h2>
                <p>조건을 선택해 물건을 빠르게 찾아보세요.</p>
            </div>
        </div>

        <form th:action="@{/search}" method="get">

            <div class="form-group">
                <label>키워드</label>

                <div class="keyword-box">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text"
                           name="keyword"
                           class="search-input"
                           placeholder="물건명, 특징을 입력하세요">
                </div>
            </div>

            <div class="form-group">
                <label>카테고리</label>

                <select name="category" class="select-box">
                    <option value="">전체 카테고리</option>
                    <option value="전자기기">전자기기</option>
                    <option value="가방">가방</option>
                    <option value="지갑">지갑</option>
                    <option value="신분증">신분증</option>
                    <option value="열쇠">열쇠</option>
                    <option value="의류">의류</option>
                    <option value="도서">도서</option>
                    <option value="기타">기타</option>
                </select>
            </div>

            <div class="form-group">
                <label>위치</label>

                <select name="location" class="select-box">
                    <option value="">전체 위치</option>

                    <option value="대학본관">대학본관</option>
                    <option value="보건복지관">보건복지관</option>
                    <option value="건축디자인관">건축디자인관</option>
                    <option value="대학원">대학원</option>
                    <option value="건축학습동">건축학습동</option>
                    <option value="학생회관">학생회관</option>
                    <option value="동명스터디움">동명스터디움</option>
                    <option value="학생복지관">학생복지관</option>
                    <option value="동명생활관 (2호관)">동명생활관(2호관)</option>
                    <option value="중앙도서관">중앙도서관</option>
                    <option value="동명관">동명관</option>
                    <option value="반려동물관">반려동물관</option>

                    <option value="ICT 1관">ICT 1관</option>
                    <option value="ICT 2관">ICT 2관</option>
                    <option value="ICT 3관">ICT 3관</option>

                    <option value="교수연구동">교수연구동</option>
                    <option value="국제대학관">국제대학관</option>
                    <option value="동명공업고등학교">동명공업고등학교</option>
                    <option value="Busan International College Office">Busan International College Office</option>
                    <option value="쉼터">쉼터</option>
                    <option value="국제산학협력관">국제산학협력관</option>
                    <option value="가온누리">가온누리</option>
                    <option value="선당">선당</option>
                    <option value="Do-ing관">Do-ing관</option>

                    <option value="봉사관">봉사관</option>
                    <option value="용마광장">용마광장</option>
                    <option value="제1정문">제1정문</option>
                    <option value="제2정문">제2정문</option>
                    <option value="제3정문">제3정문</option>

                    <option value="제1주차장">제1주차장</option>
                    <option value="제2주차장">제2주차장</option>
                    <option value="제3주차장">제3주차장</option>
                    <option value="제5주차장">제5주차장</option>

                    <option value="대운동장 1">대운동장 1</option>
                    <option value="대운동장 2">대운동장 2</option>
                    <option value="원형광장">원형광장</option>
                    <option value="주차관리소">주차관리소</option>
                    <option value="종합체육시설">종합체육시설</option>
                    <option value="순환버스 정류장">순환버스 정류장</option>
                    <option value="마지뜨락">마지뜨락</option>
                    <option value="분수대">분수대</option>
                    <option value="학생휴게점(cafe)">학생휴게점(cafe)</option>

                    <option value="동명생활관 (1호관)">동명생활관 (1호관)</option>
                    <option value="동명뜰">동명뜰</option>
                    <option value="체육시설관리동">체육시설관리동</option>
                    <option value="그린스타트업타운">그린스타트업타운</option>
                    <option value="대학동물병원">대학동물병원</option>
                    <option value="창업거점지구">창업거점지구</option>
                </select>
            </div>

            <div class="form-group">
                <label>날짜 범위</label>

                <div class="date-list">
                    <input type="date" name="startDate" class="date-input">
                    <input type="date" name="endDate" class="date-input">
                </div>
            </div>

            <button type="submit" class="search-btn">
                <i class="fa-solid fa-magnifying-glass"></i>
                검색하기
            </button>

        </form>

    </aside>

    <main class="content">

        <section class="search-hero">

            <div>
                <span class="hero-badge">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    통합 검색
                </span>

                <h1>분실물과 습득물을 한 번에 찾아보세요</h1>

                <p>
                    물건명, 위치, 날짜 조건을 이용해 등록된 분실물과 습득물을 빠르게 확인할 수 있습니다.
                </p>
            </div>

            <div class="hero-count">
                <strong id="resultCount">2</strong>
                <span>검색 결과</span>
            </div>

        </section>

        <div class="result-head">

            <div>
                <div class="result-title" id="resultTitle">분실물 검색 결과 2건</div>
                <p class="result-desc">조건에 맞는 분실물과 습득물을 확인하세요.</p>
            </div>

            <div class="sort-box">
                <select>
                    <option>최신순</option>
                    <option>이름순</option>
                    <option>위치순</option>
                </select>
            </div>

        </div>

        <div class="tab-menu">
            <button type="button" class="active" data-filter="lost">분실물 (2)</button>
            <button type="button" data-filter="found">습득물 (2)</button>
        </div>

        <div class="result-list">

            <a th:href="@{/lost/detail}" class="result-item lost-item">
                <div class="thumb">
                    <i class="fa-solid fa-briefcase"></i>
                </div>

                <div class="result-info">
                    <div class="result-top">
                        <h3>검정 노트북 가방</h3>
                        <span class="item-type lost">분실물</span>
                    </div>

                    <p>
                        <i class="fa-solid fa-location-dot"></i>
                        중앙도서관 2층 · 오늘 14:30
                    </p>
                </div>

                <div class="result-arrow">
                    <i class="fa-solid fa-chevron-right"></i>
                </div>
            </a>

            <a th:href="@{/found/detail}" class="result-item found-item hidden">
                <div class="thumb">
                    <i class="fa-solid fa-headphones"></i>
                </div>

                <div class="result-info">
                    <div class="result-top">
                        <h3>에어팟 프로</h3>
                        <span class="item-type found">습득물</span>
                    </div>

                    <p>
                        <i class="fa-solid fa-location-dot"></i>
                        ICT 2관 201호 · 오늘 09:15
                    </p>
                </div>

                <div class="result-arrow">
                    <i class="fa-solid fa-chevron-right"></i>
                </div>
            </a>

            <a th:href="@{/lost/detail}" class="result-item lost-item">
                <div class="thumb">
                    <i class="fa-solid fa-id-card"></i>
                </div>

                <div class="result-info">
                    <div class="result-top">
                        <h3>학생증 분실</h3>
                        <span class="item-type lost">분실물</span>
                    </div>

                    <p>
                        <i class="fa-solid fa-location-dot"></i>
                        ICT 1관 3층 · 오늘 11:00
                    </p>
                </div>

                <div class="result-arrow">
                    <i class="fa-solid fa-chevron-right"></i>
                </div>
            </a>

            <a th:href="@{/found/detail}" class="result-item found-item hidden">
                <div class="thumb">
                    <i class="fa-solid fa-wallet"></i>
                </div>

                <div class="result-info">
                    <div class="result-top">
                        <h3>지갑 발견</h3>
                        <span class="item-type found">습득물</span>
                    </div>

                    <p>
                        <i class="fa-solid fa-location-dot"></i>
                        대학원 앞 · 오늘 10:30
                    </p>
                </div>

                <div class="result-arrow">
                    <i class="fa-solid fa-chevron-right"></i>
                </div>
            </a>

        </div>

    </main>

</div>

<script>
    document.addEventListener("DOMContentLoaded", function () {
        const tabButtons = document.querySelectorAll(".tab-menu button");
        const lostItems = document.querySelectorAll(".lost-item");
        const foundItems = document.querySelectorAll(".found-item");
        const resultCount = document.getElementById("resultCount");
        const resultTitle = document.getElementById("resultTitle");

        function showLostItems() {
            lostItems.forEach(function (item) {
                item.classList.remove("hidden");
            });

            foundItems.forEach(function (item) {
                item.classList.add("hidden");
            });

            resultCount.textContent = lostItems.length;
            resultTitle.textContent = "분실물 검색 결과 " + lostItems.length + "건";
        }

        function showFoundItems() {
            foundItems.forEach(function (item) {
                item.classList.remove("hidden");
            });

            lostItems.forEach(function (item) {
                item.classList.add("hidden");
            });

            resultCount.textContent = foundItems.length;
            resultTitle.textContent = "습득물 검색 결과 " + foundItems.length + "건";
        }

        tabButtons.forEach(function (button) {
            button.addEventListener("click", function () {
                tabButtons.forEach(function (btn) {
                    btn.classList.remove("active");
                });

                button.classList.add("active");

                const filter = button.getAttribute("data-filter");

                if (filter === "lost") {
                    showLostItems();
                }

                if (filter === "found") {
                    showFoundItems();
                }
            });
        });

        showLostItems();
    });
</script>

</body>
</html>

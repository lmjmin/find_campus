<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>회원가입 | FindCampus</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family:Arial,sans-serif;
            background:#f5f7fb;

            min-height:100vh;

            display:flex;
            align-items:center;
            justify-content:center;

            padding:40px 20px;
        }

        .join-container{
            width:100%;
            max-width:1100px;

            display:grid;
            grid-template-columns:1fr 1fr;

            background:#ffffff;

            border-radius:32px;

            overflow:hidden;

            box-shadow:0 20px 40px rgba(0,0,0,0.08);
        }

        .left-section{
            background:linear-gradient(135deg,#4f46e5,#1e3a8a);

            color:white;

            padding:70px;

            display:flex;
            flex-direction:column;
            justify-content:center;
        }

        .logo{
            display:flex;
            align-items:center;
            gap:12px;

            font-size:32px;
            font-weight:800;

            margin-bottom:30px;
        }

        .logo-icon{
            width:60px;
            height:60px;

            border-radius:18px;

            background:rgba(255,255,255,0.15);

            display:flex;
            align-items:center;
            justify-content:center;

            font-size:26px;
        }

        .left-section h1{
            font-size:46px;
            line-height:1.3;

            margin-bottom:20px;
        }

        .left-section p{
            font-size:17px;
            line-height:1.7;

            color:#dbeafe;
        }

        .right-section{
            padding:60px;

            overflow-y:auto;
        }

        .form-title{
            font-size:36px;
            font-weight:800;

            margin-bottom:10px;
        }

        .form-subtitle{
            color:#6b7280;

            margin-bottom:35px;

            line-height:1.6;
        }

        .input-group{
            margin-bottom:20px;
        }

        .input-group label{
            display:block;

            margin-bottom:10px;

            font-size:14px;
            font-weight:700;

            color:#374151;
        }

        .input-box{
            width:100%;
            height:56px;

            border:1px solid #d1d5db;
            border-radius:16px;

            padding:0 18px;

            display:flex;
            align-items:center;
            gap:12px;

            transition:0.2s;
        }

        .input-box:focus-within{
            border-color:#2563eb;
        }

        .input-box i{
            color:#9ca3af;
        }

        .input-box input{
            flex:1;

            border:none;
            outline:none;

            font-size:15px;
        }

        .checkbox-wrap{
            margin-top:10px;

            display:flex;
            align-items:center;
            gap:10px;

            font-size:14px;

            color:#4b5563;
        }

        .join-btn{
            width:100%;
            height:58px;

            margin-top:25px;

            border:none;
            border-radius:18px;

            background:linear-gradient(135deg,#4f46e5,#2563eb);

            color:white;

            font-size:16px;
            font-weight:800;

            cursor:pointer;

            transition:0.2s;
        }

        .join-btn:hover{
            transform:translateY(-2px);
        }

        .bottom-text{
            margin-top:30px;

            text-align:center;

            color:#6b7280;
            font-size:14px;
        }

        .bottom-text a{
            color:#2563eb;
            text-decoration:none;
            font-weight:700;
        }

        @media(max-width:900px){

            .join-container{
                grid-template-columns:1fr;
            }

            .left-section{
                display:none;
            }

            .right-section{
                padding:40px 25px;
            }
        }

    </style>

</head>

<body>

<div class="join-container">

    <div class="left-section">

        <div class="logo">

            <div class="logo-icon">
                <i class="fa-solid fa-magnifying-glass-location"></i>
            </div>

            FindCampus

        </div>

        <h1>
            동명대학교<br>
            학생 전용 서비스
        </h1>

        <p>
            학교 구성원들과 함께<br>
            안전하고 빠르게 분실물을 찾아보세요.
        </p>

    </div>

    <div class="right-section">

        <div class="form-title">
            회원가입
        </div>

        <div class="form-subtitle">
            학교 이메일 또는 학번으로 가입할 수 있습니다.
        </div>

        <form th:action="@{/join}" method="post">

            <div class="input-group">

                <label>이름</label>

                <div class="input-box">

                    <i class="fa-solid fa-user"></i>

                    <input type="text"
                           name="name"
                           placeholder="이름을 입력하세요">

                </div>

            </div>

            <div class="input-group">

                <label>학번</label>

                <div class="input-box">

                    <i class="fa-solid fa-id-card"></i>

                    <input type="text"
                           name="studentNo"
                           placeholder="예: 23120030">

                </div>

            </div>

            <div class="input-group">

                <label>학교 이메일</label>

                <div class="input-box">

                    <i class="fa-solid fa-envelope"></i>

                    <input type="email"
                           name="email"
                           placeholder="tongmyong@tu.ac.kr">

                </div>

            </div>

            <div class="input-group">

                <label>비밀번호</label>

                <div class="input-box">

                    <i class="fa-solid fa-lock"></i>

                    <input type="password"
                           name="password"
                           placeholder="8자 이상 입력하세요">

                </div>

            </div>

            <div class="input-group">

                <label>비밀번호 확인</label>

                <div class="input-box">

                    <i class="fa-solid fa-lock"></i>

                    <input type="password"
                           name="passwordCheck"
                           placeholder="비밀번호를 다시 입력하세요">

                </div>

            </div>

            <div class="checkbox-wrap">

                <input type="checkbox" id="agree">

                <label for="agree">
                    이용약관 및 개인정보처리방침에 동의합니다.
                </label>

            </div>

            <button type="submit" class="join-btn">
                회원가입 완료
            </button>

        </form>

        <div class="bottom-text">
            이미 계정이 있으신가요?
            <a th:href="@{/login}">
                로그인
            </a>
        </div>

    </div>

</div>

</body>
</html>

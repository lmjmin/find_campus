<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>로그인 | FindCampus</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family:Arial,sans-serif;
            background:#f5f7fb;

            min-height:100vh;

            display:flex;
            align-items:center;
            justify-content:center;

            padding:40px 20px;
        }

        .login-container{
            width:100%;
            max-width:1100px;

            display:grid;
            grid-template-columns:1fr 1fr;

            background:#ffffff;

            border-radius:32px;

            overflow:hidden;

            box-shadow:0 20px 40px rgba(0,0,0,0.08);
        }

        .left-section{
            background:linear-gradient(135deg,#4f46e5,#1e3a8a);

            color:white;

            padding:70px;

            display:flex;
            flex-direction:column;
            justify-content:center;
        }

        .logo{
            display:flex;
            align-items:center;
            gap:12px;

            font-size:32px;
            font-weight:800;

            margin-bottom:30px;
        }

        .logo-icon{
            width:60px;
            height:60px;

            border-radius:18px;

            background:rgba(255,255,255,0.15);

            display:flex;
            align-items:center;
            justify-content:center;

            font-size:26px;
        }

        .left-section h1{
            font-size:48px;
            line-height:1.3;

            margin-bottom:20px;
        }

        .left-section p{
            font-size:17px;
            line-height:1.7;

            color:#dbeafe;
        }

        .right-section{
            padding:70px 60px;

            display:flex;
            flex-direction:column;
            justify-content:center;
        }

        .form-title{
            font-size:36px;
            font-weight:800;

            margin-bottom:10px;
        }

        .form-subtitle{
            color:#6b7280;

            margin-bottom:40px;

            line-height:1.6;
        }

        .input-group{
            margin-bottom:22px;
        }

        .input-group label{
            display:block;

            margin-bottom:10px;

            font-size:14px;
            font-weight:700;

            color:#374151;
        }

        .input-box{
            width:100%;
            height:56px;

            border:1px solid #d1d5db;
            border-radius:16px;

            padding:0 18px;

            display:flex;
            align-items:center;
            gap:12px;

            transition:0.2s;
        }

        .input-box:focus-within{
            border-color:#2563eb;
        }

        .input-box i{
            color:#9ca3af;
        }

        .input-box input{
            flex:1;

            border:none;
            outline:none;

            font-size:15px;
        }

        .login-btn{
            width:100%;
            height:58px;

            border:none;
            border-radius:18px;

            background:linear-gradient(135deg,#4f46e5,#2563eb);

            color:white;

            font-size:16px;
            font-weight:800;

            cursor:pointer;

            margin-top:10px;

            transition:0.2s;
        }

        .login-btn:hover{
            transform:translateY(-2px);
        }

        .extra-menu{
            margin-top:20px;

            display:flex;
            justify-content:space-between;

            font-size:14px;
        }

        .extra-menu a{
            color:#2563eb;
            text-decoration:none;
            font-weight:600;
        }

        .divider{
            margin:35px 0;

            display:flex;
            align-items:center;
            gap:15px;

            color:#9ca3af;
            font-size:14px;
        }

        .divider::before,
        .divider::after{
            content:"";

            flex:1;
            height:1px;

            background:#e5e7eb;
        }

        .school-login{
            width:100%;
            height:56px;

            border:none;
            border-radius:16px;

            background:#eef2ff;

            color:#1d4ed8;

            font-size:15px;
            font-weight:700;

            cursor:pointer;

            display:flex;
            align-items:center;
            justify-content:center;
            gap:10px;
        }

        .bottom-text{
            margin-top:35px;

            text-align:center;

            color:#6b7280;
            font-size:14px;
        }

        .bottom-text a{
            color:#2563eb;
            font-weight:700;
            text-decoration:none;
        }

        @media(max-width:900px){

            .login-container{
                grid-template-columns:1fr;
            }

            .left-section{
                display:none;
            }

            .right-section{
                padding:50px 30px;
            }
        }

    </style>

</head>

<body>

<div class="login-container">

    <div class="left-section">

        <div class="logo">

            <div class="logo-icon">
                <i class="fa-solid fa-magnifying-glass-location"></i>
            </div>

            FindCampus

        </div>

        <h1>
            동명대학교<br>
            스마트 분실물 서비스
        </h1>

        <p>
            분실물과 습득물을 쉽고 빠르게 연결하는<br>
            동명대학교 학생 전용 플랫폼입니다.
        </p>

    </div>

    <div class="right-section">

        <div class="form-title">
            로그인
        </div>

        <div class="form-subtitle">
            학번 또는 학교 이메일로 로그인하세요.
        </div>

        <form th:action="@{/login}" method="post">

            <div class="input-group">

                <label>학번 또는 학교 이메일</label>

                <div class="input-box">

                    <i class="fa-solid fa-user"></i>

                    <input type="text"
                           name="loginId"
                           placeholder="예: 23120030 또는 tongmyong@tu.ac.kr">

                </div>

            </div>

            <div class="input-group">

                <label>비밀번호</label>

                <div class="input-box">

                    <i class="fa-solid fa-lock"></i>

                    <input type="password"
                           name="password"
                           placeholder="비밀번호를 입력하세요">

                </div>

            </div>

            <div class="extra-menu">

                <a href="#">비밀번호를 잊으셨나요?</a>

            </div>

            <button type="submit" class="login-btn">
                로그인
            </button>

        </form>

        <div class="divider">
            또는
        </div>

        <button class="school-login">

            <i class="fa-solid fa-building-columns"></i>

            동명대학교 로그인

        </button>

        <div class="bottom-text">
            아직 계정이 없으신가요?
            <a th:href="@{/join}">
                회원가입
            </a>
        </div>

    </div>

</div>

</body>
</html>

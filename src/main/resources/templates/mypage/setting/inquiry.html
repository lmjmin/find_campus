<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>문의하기 | FindCampus</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/mypage/setting/setting.css}">
    <link rel="stylesheet" th:href="@{/css/mypage/setting/inquiry.css}">
</head>

<body>

<div th:replace="~{fragments/header :: header}"></div>

<div class="setting-detail-page">

    <div class="setting-detail-container">

        <div class="setting-detail-header">
            <button type="button" class="setting-back-btn" onclick="location.href='/mypage/setting'">
                <i class="fa-solid fa-chevron-left"></i>
            </button>

            <div class="setting-detail-title-box">
                <h1>문의하기</h1>
                <p>서비스 이용 중 궁금한 점이나 불편한 점을 남겨주세요.</p>
            </div>
        </div>

        <div class="setting-detail-card inquiry-card">

            <div class="inquiry-info-box">
                <div class="inquiry-info-icon">
                    <i class="fa-solid fa-circle-question"></i>
                </div>

                <div class="inquiry-info-text">
                    <strong>문의 전 확인해주세요</strong>
                    <p>
                        분실물 수령, 습득물 보관, 유사 물건 추천, 신고 처리 등 서비스 이용과 관련된 문의를 남길 수 있습니다.
                        접수된 문의는 관리자 확인 후 답변됩니다.
                    </p>
                </div>
            </div>

            <form class="inquiry-form">

                <div class="inquiry-form-group">
                    <label for="inquiryType">문의 유형</label>
                    <select id="inquiryType" name="inquiryType">
                        <option value="">문의 유형을 선택해주세요</option>
                        <option value="lost">분실물 문의</option>
                        <option value="found">습득물 문의</option>
                        <option value="match">유사 물건 추천 문의</option>
                        <option value="report">신고 관련 문의</option>
                        <option value="etc">기타 문의</option>
                    </select>
                </div>

                <div class="inquiry-form-group">
                    <label for="title">제목</label>
                    <input type="text" id="title" name="title" placeholder="문의 제목을 입력해주세요">
                </div>

                <div class="inquiry-form-group">
                    <label for="content">문의 내용</label>
                    <textarea id="content" name="content" placeholder="문의 내용을 자세히 입력해주세요"></textarea>
                </div>

                <div class="inquiry-form-group">
                    <label for="email">답변 받을 이메일</label>
                    <input type="email" id="email" name="email" placeholder="example@email.com">
                </div>

                <div class="inquiry-notice">
                    <i class="fa-solid fa-triangle-exclamation"></i>
                    <span>비밀번호, 주민등록번호, 상세 주소 등 민감한 개인정보는 문의 내용에 작성하지 마세요.</span>
                </div>

                <div class="inquiry-button-area">
                    <button type="button" class="inquiry-cancel-btn" onclick="location.href='/mypage/setting'">
                        취소
                    </button>

                    <button type="submit" class="inquiry-submit-btn">
                        문의 접수
                    </button>
                </div>

            </form>

        </div>

    </div>

</div>

</body>

</html>

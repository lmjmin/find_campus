<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>문의하기 | FindCampus</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/mypage.css}">
</head>

<body>

<div th:replace="~{fragments/header :: header}"></div>

<div class="container">

    <div class="page-head">
        <h1>문의하기</h1>
        <p>
            서비스 이용 중 불편한 점이나 궁금한 점을 남겨주세요.
            확인 후 빠르게 답변드리겠습니다.
        </p>
    </div>

    <div class="inquiry-card">

        <form th:action="@{/mypage/setting/inquiry}" method="post">

            <div class="form-group">
                <label for="type">문의 유형</label>

                <select id="type" name="type" class="select">
                    <option value="">문의 유형을 선택하세요</option>
                    <option value="BUG">오류/버그 신고</option>
                    <option value="ACCOUNT">계정 관련</option>
                    <option value="LOST_FOUND">분실물/습득물 관련</option>
                    <option value="CHAT">채팅 관련</option>
                    <option value="AI">AI 추천 관련</option>
                    <option value="ETC">기타 문의</option>
                </select>
            </div>

            <div class="form-group">
                <label for="title">제목</label>

                <input
                        id="title"
                        type="text"
                        name="title"
                        class="input"
                        placeholder="문의 제목을 입력하세요">
            </div>

            <div class="form-group">
                <label for="content">문의 내용</label>

                <textarea
                        id="content"
                        name="content"
                        class="textarea"
                        placeholder="문의 내용을 자세히 작성해주세요."></textarea>

                <div class="help-text">
                    문제가 발생한 화면, 상황, 시간 등을 함께 적으면 더 빠르게 확인할 수 있습니다.
                </div>
            </div>

            <div class="form-group">
                <label>첨부파일</label>

                <div class="file-box">
                    <i class="fa-regular fa-image"></i>
                    화면 캡처 이미지 첨부 영역
                </div>

                <div class="help-text">
                    현재는 화면 UI용입니다. 실제 업로드 기능은 백엔드 구현 시 연결하면 됩니다.
                </div>
            </div>

            <label class="check-row">
                <input type="checkbox" name="replyNotice" checked>
                답변이 등록되면 알림으로 알려주세요
            </label>

            <div class="button-area">
                <a th:href="@{/mypage/setting}" class="back-btn">
                    <i class="fa-solid fa-arrow-left"></i>
                    설정으로
                </a>

                <button type="submit" class="submit-btn">
                    <i class="fa-regular fa-paper-plane"></i>
                    문의 등록
                </button>
            </div>

        </form>

    </div>

    <div class="info-box">
        <i class="fa-solid fa-circle-info"></i>
        <div>
            문의 답변은 마이페이지 알림 또는 등록한 이메일을 통해 확인할 수 있습니다.
            긴급한 분실물 반환 문제는 채팅 기능을 먼저 이용하는 것을 권장합니다.
        </div>
    </div>

</div>

</body>

</html>

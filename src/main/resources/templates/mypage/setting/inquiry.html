<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>문의하기 | FindCampus</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #1f2937;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        header {
            height: 72px;
            background: #ffffff;
            border-bottom: 1px solid #e5e7eb;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-inner {
            max-width: 1200px;
            height: 100%;
            margin: 0 auto;
            padding: 0 24px;

            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;

            font-size: 22px;
            font-weight: 800;
            color: #1d4ed8;
        }

        .logo-icon {
            width: 36px;
            height: 36px;
            border-radius: 12px;
            background: #eef2ff;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .nav {
            display: flex;
            gap: 30px;
            font-size: 15px;
            font-weight: 700;
        }

        .nav a:hover {
            color: #2563eb;
        }

        .user-menu {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .icon-btn {
            width: 44px;
            height: 44px;
            border-radius: 999px;
            background: #f5f6fb;

            display: flex;
            align-items: center;
            justify-content: center;

            color: #4f46e5;
            transition: 0.2s;
        }

        .icon-btn:hover {
            background: #e9ecff;
            transform: translateY(-1px);
        }

        .container {
            max-width: 920px;
            margin: 0 auto;
            padding: 42px 24px 80px;
        }

        .page-head {
            margin-bottom: 28px;
        }

        .page-head h1 {
            font-size: 34px;
            margin-bottom: 10px;
        }

        .page-head p {
            color: #6b7280;
            font-size: 15px;
            line-height: 1.6;
        }

        .inquiry-card {
            background: #ffffff;
            border-radius: 26px;
            padding: 32px;
            box-shadow: 0 8px 24px rgba(15, 23, 42, 0.06);
            border: 1px solid #eef2f7;
        }

        .form-group {
            margin-bottom: 24px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 800;
            margin-bottom: 10px;
            color: #374151;
        }

        .input,
        .select,
        .textarea {
            width: 100%;
            border: 1px solid #e5e7eb;
            border-radius: 15px;
            background: #f9fafb;
            outline: none;
            font-size: 14px;
            color: #1f2937;
        }

        .input,
        .select {
            height: 50px;
            padding: 0 16px;
        }

        .textarea {
            min-height: 180px;
            padding: 16px;
            resize: vertical;
            line-height: 1.7;
        }

        .input:focus,
        .select:focus,
        .textarea:focus {
            border-color: #2563eb;
            background: #ffffff;
        }

        .help-text {
            margin-top: 8px;
            font-size: 13px;
            color: #9ca3af;
            line-height: 1.5;
        }

        .file-box {
            height: 70px;
            border: 1px dashed #cbd5e1;
            border-radius: 16px;
            background: #f8fafc;

            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;

            color: #6b7280;
            font-size: 14px;
        }

        .check-row {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #4b5563;
            font-size: 14px;
            margin-bottom: 26px;
        }

        .check-row input {
            width: 16px;
            height: 16px;
        }

        .button-area {
            display: flex;
            gap: 12px;
        }

        .submit-btn,
        .back-btn {
            height: 52px;
            border-radius: 16px;

            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;

            font-size: 14px;
            font-weight: 800;
        }

        .submit-btn {
            flex: 1;
            border: none;
            background: #2563eb;
            color: #ffffff;
            cursor: pointer;
        }

        .back-btn {
            width: 170px;
            background: #ffffff;
            color: #2563eb;
            border: 1px solid #dbeafe;
        }

        .info-box {
            margin-top: 24px;
            background: #eef2ff;
            color: #3730a3;
            border-radius: 20px;
            padding: 20px;
            display: flex;
            gap: 14px;
            line-height: 1.6;
            font-size: 14px;
        }

        .info-box i {
            margin-top: 3px;
            flex-shrink: 0;
        }

        @media (max-width: 800px) {
            .nav {
                display: none;
            }

            .button-area {
                flex-direction: column;
            }

            .back-btn {
                width: 100%;
            }

            .inquiry-card {
                padding: 24px;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="header-inner">

        <a th:href="@{/}" class="logo">
            <span class="logo-icon">
                <i class="fa-solid fa-magnifying-glass-location"></i>
            </span>
            FindCampus
        </a>

        <nav class="nav">
            <a th:href="@{/lost/list}">분실물</a>
            <a th:href="@{/found/list}">습득물</a>
            <a th:href="@{/search}">검색</a>
            <a th:href="@{/map}">지도</a>
        </nav>

        <div class="user-menu">
            <a th:href="@{/notification}" class="icon-btn">
                <i class="fa-regular fa-bell"></i>
            </a>

            <a th:href="@{/mypage}" class="icon-btn">
                <i class="fa-solid fa-user"></i>
            </a>
        </div>

    </div>
</header>

<div class="container">

    <div class="page-head">
        <h1>문의하기</h1>
        <p>
            서비스 이용 중 불편한 점이나 궁금한 점을 남겨주세요.
            확인 후 빠르게 답변드리겠습니다.
        </p>
    </div>

    <div class="inquiry-card">

        <form th:action="@{/mypage/setting/inquiry}" method="post">

            <div class="form-group">
                <label for="type">문의 유형</label>

                <select id="type" name="type" class="select">
                    <option value="">문의 유형을 선택하세요</option>
                    <option value="BUG">오류/버그 신고</option>
                    <option value="ACCOUNT">계정 관련</option>
                    <option value="LOST_FOUND">분실물/습득물 관련</option>
                    <option value="CHAT">채팅 관련</option>
                    <option value="AI">AI 추천 관련</option>
                    <option value="ETC">기타 문의</option>
                </select>
            </div>

            <div class="form-group">
                <label for="title">제목</label>

                <input
                        id="title"
                        type="text"
                        name="title"
                        class="input"
                        placeholder="문의 제목을 입력하세요">
            </div>

            <div class="form-group">
                <label for="content">문의 내용</label>

                <textarea
                        id="content"
                        name="content"
                        class="textarea"
                        placeholder="문의 내용을 자세히 작성해주세요."></textarea>

                <div class="help-text">
                    문제가 발생한 화면, 상황, 시간 등을 함께 적으면 더 빠르게 확인할 수 있습니다.
                </div>
            </div>

            <div class="form-group">
                <label>첨부파일</label>

                <div class="file-box">
                    <i class="fa-regular fa-image"></i>
                    화면 캡처 이미지 첨부 영역
                </div>

                <div class="help-text">
                    현재는 화면 UI용입니다. 실제 업로드 기능은 백엔드 구현 시 연결하면 됩니다.
                </div>
            </div>

            <label class="check-row">
                <input type="checkbox" name="replyNotice" checked>
                답변이 등록되면 알림으로 알려주세요
            </label>

            <div class="button-area">
                <a th:href="@{/mypage/setting}" class="back-btn">
                    <i class="fa-solid fa-arrow-left"></i>
                    설정으로
                </a>

                <button type="submit" class="submit-btn">
                    <i class="fa-regular fa-paper-plane"></i>
                    문의 등록
                </button>
            </div>

        </form>

    </div>

    <div class="info-box">
        <i class="fa-solid fa-circle-info"></i>
        <div>
            문의 답변은 마이페이지 알림 또는 등록한 이메일을 통해 확인할 수 있습니다.
            긴급한 분실물 반환 문제는 채팅 기능을 먼저 이용하는 것을 권장합니다.
        </div>
    </div>

</div>

</body>

</html>

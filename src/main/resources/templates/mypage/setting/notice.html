<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>공지사항 | FindCampus</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Arial,sans-serif;
background:#f5f7fb;
color:#1f2937;
}

a{
text-decoration:none;
color:inherit;
}

/* 헤더 */

header{
height:72px;
background:#fff;
border-bottom:1px solid #e5e7eb;
}

.header-inner{
max-width:1200px;
height:100%;

margin:auto;

padding:0 24px;

display:flex;
align-items:center;
justify-content:space-between;
}

.logo{
display:flex;
align-items:center;
gap:10px;

font-size:24px;

font-weight:700;

color:#3b49df;
}

.logo-icon{

width:40px;
height:40px;

border-radius:14px;

background:#eef2ff;

display:flex;

align-items:center;
justify-content:center;

}

.nav{

display:flex;

gap:34px;

font-size:15px;

}

.nav a.active{
color:#3b49df;
}

.user-menu{

display:flex;

gap:12px;

}

.icon-btn{

width:44px;
height:44px;

border-radius:999px;

background:#f3f6fb;

display:flex;

align-items:center;
justify-content:center;

}

/* 본문 */

.container{

max-width:1000px;

margin:40px auto;

padding:0 24px;

}

.page-title{

margin-bottom:24px;

}

.page-title h1{

font-size:34px;

margin-bottom:10px;

}

.page-title p{

color:#6b7280;

}

.notice-box{

display:flex;

flex-direction:column;

gap:18px;

}

.notice-card{

background:white;

border-radius:20px;

padding:26px;

box-shadow:

0 8px 20px rgba(0,0,0,.04);

}

.notice-top{

display:flex;

justify-content:space-between;

margin-bottom:12px;

}

.badge{

padding:8px 14px;

border-radius:999px;

font-size:12px;

font-weight:700;

}

.badge.notice{

background:#eef2ff;

color:#3b49df;

}

.date{

color:#9ca3af;

font-size:13px;

}

.notice-title{

font-size:20px;

font-weight:700;

margin-bottom:10px;

}

.notice-content{

line-height:1.8;

color:#6b7280;

}

.back-btn{

margin-top:32px;

display:inline-flex;

align-items:center;

gap:8px;

padding:14px 18px;

background:#fff;

border-radius:14px;

}

</style>

</head>

<body>

<header>

<div class="header-inner">

<a th:href="@{/}" class="logo">

<span class="logo-icon">

<i class="fa-solid fa-magnifying-glass-location"></i>

</span>

FindCampus

</a>

<nav class="nav">

<a th:href="@{/lost/list}">
분실물
</a>

<a th:href="@{/found/list}">
습득물
</a>

<a th:href="@{/search}">
검색
</a>

<a th:href="@{/map}">
지도
</a>

</nav>

<div class="user-menu">

<a th:href="@{/notification}" class="icon-btn">

<i class="fa-regular fa-bell"></i>

</a>

<a th:href="@{/mypage}" class="icon-btn">

<i class="fa-regular fa-user"></i>

</a>

</div>

</div>

</header>


<div class="container">

<div class="page-title">

<h1>
공지사항
</h1>

<p>

서비스 공지 및 업데이트 내용을 확인하세요.

</p>

</div>

<div class="notice-box">

<div class="notice-card">

<div class="notice-top">

<span class="badge notice">

공지

</span>

<span class="date">

2026.05.27

</span>

</div>

<div class="notice-title">

FindCampus 정식 오픈 안내

</div>

<div class="notice-content">

안녕하세요.<br><br>

FindCampus가 정식 오픈되었습니다.<br>

분실물 등록, 습득물 등록, 채팅 및 AI 추천 서비스를 이용할 수 있습니다.

</div>

</div>


<div class="notice-card">

<div class="notice-top">

<span class="badge notice">

업데이트

</span>

<span class="date">

2026.05.20

</span>

</div>

<div class="notice-title">

알림 기능 개선

</div>

<div class="notice-content">

실시간 알림 및 채팅 알림 기능이 추가되었습니다.

</div>

</div>

</div>

<a
th:href="@{/mypage/setting}"
class="back-btn">

<i class="fa-solid fa-arrow-left">

</i>

설정으로 돌아가기

</a>

</div>

</body>

</html>

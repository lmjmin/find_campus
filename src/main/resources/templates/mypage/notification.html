<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>

<meta charset="UTF-8">
<title>알림 | FindCampus</title>

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Arial,sans-serif;
background:#f5f7fb;
color:#111827;
}

a{
text-decoration:none;
color:inherit;
}

/* =======================
HEADER
======================= */

header{

height:72px;

background:#fff;

border-bottom:1px solid #e5e7eb;

}

.header-inner{

max-width:1200px;

height:100%;

margin:auto;

padding:0 24px;

display:flex;

align-items:center;

justify-content:space-between;

}

.logo{

display:flex;

align-items:center;

gap:10px;

font-size:22px;

font-weight:800;

color:#3b49df;

}

.logo-icon{

width:36px;
height:36px;

border-radius:12px;

background:#eef2ff;

display:flex;

align-items:center;

justify-content:center;

}

.nav{

display:flex;

gap:34px;

font-size:15px;

font-weight:700;

}

.nav a.active,
.nav a:hover{

color:#3b49df;

}

.auth{

display:flex;

gap:12px;

}

.header-icon{

width:42px;

height:42px;

border-radius:50%;

background:#f3f6fb;

display:flex;

align-items:center;

justify-content:center;

color:#3b49df;

}

.header-icon:hover{

background:#e9ecff;

}

/* =======================
PAGE
======================= */

.container{

max-width:920px;

margin:auto;

padding:34px 20px 80px;

}

.page-head{

display:flex;

justify-content:space-between;

align-items:center;

margin-bottom:24px;

}

.page-title{

font-size:28px;

font-weight:800;

}

.read-all{

color:#4f46e5;

font-size:14px;

font-weight:700;

}

.summary{

background:

linear-gradient(
90deg,
#5b5de9,
#3949c9
);

padding:22px;

border-radius:22px;

color:white;

display:flex;

align-items:center;

gap:18px;

margin-bottom:26px;

}

.summary-icon{

width:56px;

height:56px;

background:

rgba(255,255,255,.15);

border-radius:18px;

display:flex;

align-items:center;

justify-content:center;

font-size:22px;

}

.summary-title{

font-size:18px;

font-weight:700;

}

.summary-desc{

font-size:14px;

opacity:.9;

margin-top:4px;

}

/* =======================
CARD
======================= */

.notify-list{

display:flex;

flex-direction:column;

gap:18px;

}

.notify-card{

background:white;

border-radius:22px;

padding:22px;

display:flex;

gap:16px;

align-items:flex-start;

box-shadow:

0 8px 20px
rgba(0,0,0,.04);

}

.notify-icon{

width:44px;

height:44px;

border-radius:50%;

display:flex;

align-items:center;

justify-content:center;

flex-shrink:0;

}

.ai{

background:#fff7d7;

color:#e4a500;

}

.msg{

background:#eef2ff;

color:#4f46e5;

}

.done{

background:#dcfce7;

color:#22c55e;

}

.notice{

background:#f3f4f6;

color:#6b7280;

}

.notify-content{

flex:1;

}

.notify-title{

font-size:16px;

font-weight:700;

margin-bottom:6px;

}

.notify-text{

font-size:14px;

color:#6b7280;

line-height:1.6;

}

.notify-meta{

display:flex;

gap:8px;

align-items:center;

font-size:13px;

color:#9ca3af;

margin-top:10px;

}

.dot{

width:7px;

height:7px;

background:#4f46e5;

border-radius:50%;

}

.bottom{

margin-top:28px;

text-align:center;

color:#9ca3af;

font-size:13px;

}

</style>

</head>

<body>

<header>

<div class="header-inner">

<a th:href="@{/}" class="logo">

<div class="logo-icon">
<i class="fa-solid fa-magnifying-glass-location"></i>
</div>

FindCampus

</a>

<nav class="nav">

<a th:href="@{/lost/list}">
분실물
</a>

<a th:href="@{/found/list}">
습득물
</a>

<a th:href="@{/search}">
검색
</a>

<a th:href="@{/map}">
지도
</a>

</nav>

<div class="auth">

<a th:href="@{/notification}"
class="header-icon">

<i class="fa-regular fa-bell"></i>

</a>

<a th:href="@{/mypage}"
class="header-icon">

<i class="fa-solid fa-user"></i>

</a>

</div>

</div>

</header>

<div class="container">

<div class="page-head">

<div class="page-title">

알림

</div>

<a href="#" class="read-all">

모두 읽음

</a>

</div>

<div class="summary">

<div class="summary-icon">

<i class="fa-regular fa-bell"></i>

</div>

<div>

<div class="summary-title">

읽지 않은 알림 3개

</div>

<div class="summary-desc">

새로운 알림을 확인하세요

</div>

</div>

</div>

<div class="notify-list">

<div class="notify-card">

<div class="notify-icon ai">

✨

</div>

<div class="notify-content">

<div class="notify-title">

AI 매칭 알림

</div>

<div class="notify-text">

검정 노트북 가방과
유사도 94% 습득물이 발견되었습니다.

</div>

<div class="notify-meta">

방금

<div class="dot"></div>

</div>

</div>

</div>

<div class="notify-card">

<div class="notify-icon msg">

<i class="fa-regular fa-comment"></i>

</div>

<div class="notify-content">

<div class="notify-title">

새 채팅 메시지

</div>

<div class="notify-text">

혹시 검정 나이키 가방 맞나요?

</div>

<div class="notify-meta">

10분 전

<div class="dot"></div>

</div>

</div>

</div>

<div class="notify-card">

<div class="notify-icon done">

<i class="fa-solid fa-circle-check"></i>

</div>

<div class="notify-content">

<div class="notify-title">

반환 완료

</div>

<div class="notify-text">

분실물이 반환 처리되었습니다.

</div>

<div class="notify-meta">

1시간 전

<div class="dot"></div>

</div>

</div>

</div>

<div class="notify-card">

<div class="notify-icon notice">

<i class="fa-solid fa-circle-info"></i>

</div>

<div class="notify-content">

<div class="notify-title">

서비스 공지

</div>

<div class="notify-text">

5월 20일 서버 점검 예정입니다.

</div>

<div class="notify-meta">

어제

</div>

</div>

</div>

</div>

<div class="bottom">

최근 7일간 알림이 표시됩니다

</div>

</div>

</body>

</html>

<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>습득물 목록 | FindCampus</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/found.css}">
</head>

<body>

<div th:replace="~{fragments/header :: header}"></div>

<div class="container">

    <main class="content">

        <div class="page-head">
            <h1>습득물 목록</h1>

            <a th:href="@{/found/write}" class="write-btn">
                습득물 등록
            </a>
        </div>

        <div class="toolbar">

            <form th:action="@{/found/list}" method="get" class="search-box">
                <label class="filter-field">
                    <i class="fa-solid fa-layer-group"></i>
                    <select class="sort-box" name="categoryId">
                        <option value="">&#51204;&#52404; &#52852;&#53580;&#44256;&#47532;</option>
                        <option th:each="category : ${categories}"
                                th:value="${category.categoryId}"
                                th:text="${category.categoryName}"
                                th:selected="${search != null and search.categoryId == category.categoryId}">
                            &#51204;&#51088;&#44592;&#44592;
                        </option>
                    </select>
                </label>

                <label class="filter-field location-field">
                    <i class="fa-solid fa-location-dot"></i>
                    <select class="sort-box" name="locationName">
                        <option value="">&#51204;&#52404; &#50948;&#52824;</option>
                        <option th:each="locationName : ${locationOptions}"
                                th:value="${locationName}"
                                th:text="${locationName}"
                                th:selected="${search != null and search.locationName == locationName}">
                            &#51473;&#50521;&#46020;&#49436;&#44288;
                        </option>
                    </select>
                </label>

                <label class="filter-field">
                    <i class="fa-solid fa-flag"></i>
                    <select class="sort-box" name="status">
                        <option value="">&#51204;&#52404; &#49345;&#53468;</option>
                        <option value="STORED" th:selected="${search != null and search.status == 'STORED'}">&#48372;&#44288;&#51473;</option>
                        <option value="RETURNED" th:selected="${search != null and search.status == 'RETURNED'}">&#48152;&#54872;&#50756;&#47308;</option>
                    </select>
                </label>

                <label class="filter-field">
                    <i class="fa-solid fa-arrow-down-wide-short"></i>
                    <select class="sort-box" name="sort">
                        <option value="latest" th:selected="${search == null or search.sort == null or search.sort == 'latest'}">&#52572;&#49888;&#49692;</option>
                        <option value="view" th:selected="${search != null and search.sort == 'view'}">&#51312;&#54924;&#49692;</option>
                        <option value="old" th:selected="${search != null and search.sort == 'old'}">&#50724;&#47000;&#46108;&#49692;</option>
                    </select>
                </label>

                <label class="search-field">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" name="keyword" th:value="${search != null ? search.keyword : ''}" placeholder="&#49845;&#46301;&#47932; &#44160;&#49353;...">
                </label>

                <button type="submit" class="filter-submit">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <span>&#44160;&#49353;</span>
                </button>
            </form>

        </div>

        <div class="result-count" th:text="|총 ${totalCount}건의 습득물|">
            총 50건의 습득물
        </div>

        <div class="item-grid">

            <div th:if="${items == null or #lists.isEmpty(items)}" class="empty-list">
                조건에 맞는 습득물이 없습니다.
            </div>

            <a th:each="item : ${items}"
               th:href="${session.loginUserId != null and item.userId != null and item.userId == session.loginUserId} ? @{/found/edit/{id}(id=${item.id})} : @{/found/detail/{id}(id=${item.id})}"
               th:classappend="${session.loginUserId != null and item.userId != null and item.userId == session.loginUserId} ? ' my-post-card' : ''"
               class="item-card">
                <div class="item-img">
                    <span class="badge"
                          th:classappend="${item.status == 'RETURNED' or item.status == 'COMPLETED' or item.status == '반환완료' ? ' status-returned' : ' status-storage'}"
                          th:text="${item.status == 'RETURNED' or item.status == 'COMPLETED' or item.status == '반환완료' ? '반환완료' : '보관중'}">보관중</span>
                    <span class="my-post-badge" th:if="${session.loginUserId != null and item.userId != null and item.userId == session.loginUserId}">내 글</span>
                    <img th:if="${item.imageUrl != null}" th:src="@{${item.imageUrl}}" alt="습득물 사진" class="item-photo">
                    <i th:if="${item.imageUrl == null}" class="fa-solid fa-box-open"></i>
                </div>

                <div class="item-body">
                    <div class="item-type">습득물</div>
                    <div class="item-title" th:text="${item.title}">에어팟 습득</div>
                    <div class="item-desc" th:text="${item.itemName + (item.color != null and item.color != '' ? ' · ' + item.color : '') + (item.brand != null and item.brand != '' ? ' · ' + item.brand : '')}">물품명 · 색상 · 브랜드</div>

                    <div class="item-meta">
                        <span><i class="fa-solid fa-location-dot"></i> <span th:text="${item.locationName != null ? item.locationName + ' ' + (item.locationDetail != null ? item.locationDetail : '') : item.locationDetail}"> 건축디자인관 6층</span></span>
                        <span><i class="fa-regular fa-clock"></i> <span th:text="${item.itemDate != null ? #dates.format(item.itemDate, 'yyyy.MM.dd') : '날짜 미입력'}">날짜 미입력</span></span>
                        <span class="item-view-count"><i class="fa-regular fa-eye"></i> &#51312;&#54924;&#49688; <span th:text="${item.viewCount}">0</span></span>
                    </div>
                </div>
            </a>

        </div>

    </main>

</div>


</body>
</html>

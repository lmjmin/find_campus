<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title th:text="${editMode == true ? '습득물 수정 | FindCampus' : '습득물 등록 | FindCampus'}">습득물 등록 | FindCampus</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/found.css}">
    <style>
        .form-card { --upload-accent: #4f65e9; }
        .upload-preview { margin-top: 14px; display: none; gap: 12px; flex-direction: column; }
        .upload-preview.active { display: flex; }
        .upload-preview-title { font-size: 13px; font-weight: 900; color: var(--upload-accent); }
        .upload-file-list { display: flex; gap: 12px; overflow-x: auto; padding: 2px 2px 10px; scroll-snap-type: x proximity; }
        .upload-file-list::-webkit-scrollbar { height: 8px; }
        .upload-file-list::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 999px; }
        .upload-thumb-card { position: relative; flex: 0 0 124px; width: 124px; border: 1px solid #e5e7eb; border-radius: 18px; overflow: hidden; background: #fff; box-shadow: 0 12px 28px rgba(15, 23, 42, 0.08); cursor: pointer; scroll-snap-align: start; text-align: left; }
        .upload-thumb-card img { display: block; width: 100%; aspect-ratio: 1 / 1; object-fit: cover; background: #f8fafc; }
        .upload-thumb-card:focus-visible { outline: 3px solid color-mix(in srgb, var(--upload-accent) 35%, transparent); outline-offset: 3px; }
        .upload-thumb-meta { padding: 9px 10px 10px; min-height: 48px; display: flex; flex-direction: column; gap: 4px; }
        .upload-thumb-name { color: #111827; font-size: 12px; font-weight: 900; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .current-photo-preview { margin: 12px 0 14px; display: flex; gap: 12px; overflow-x: auto; padding-bottom: 8px; }
        .current-photo-card { flex: 0 0 124px; width: 124px; border: 1px solid #e5e7eb; border-radius: 18px; overflow: hidden; background: #fff; box-shadow: 0 12px 28px rgba(15, 23, 42, 0.08); }
        .current-photo-card img { width: 100%; aspect-ratio: 1 / 1; object-fit: cover; display: block; background: #f8fafc; }
        .current-photo-label { padding: 9px 10px 10px; color: var(--upload-accent); font-size: 12px; font-weight: 900; }
        .upload-main-badge { position: absolute; left: 8px; top: 8px; padding: 5px 8px; border-radius: 999px; background: var(--upload-accent); color: #fff; font-size: 11px; font-weight: 900; box-shadow: 0 8px 18px rgba(15, 23, 42, 0.16); }
        .upload-remove-button { position: absolute; right: 7px; top: 7px; width: 30px; height: 30px; border: 0; border-radius: 999px; display: inline-flex; align-items: center; justify-content: center; color: #991b1b; background: rgba(254, 226, 226, 0.94); cursor: pointer; box-shadow: 0 6px 18px rgba(15, 23, 42, 0.16); }
        .upload-remove-button:hover { background: #fecaca; }
        .photo-editor-backdrop { position: fixed; inset: 0; z-index: 1000; display: none; align-items: center; justify-content: center; padding: 24px; background: rgba(15, 23, 42, 0.58); backdrop-filter: blur(4px); }
        .photo-editor-backdrop.active { display: flex; }
        .photo-editor-panel { width: min(720px, 100%); border-radius: 24px; background: #fff; box-shadow: 0 28px 80px rgba(15, 23, 42, 0.28); overflow: hidden; }
        .photo-editor-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 18px 20px; border-bottom: 1px solid #edf0f5; }
        .photo-editor-head strong { font-size: 18px; font-weight: 950; color: #111827; }
        .photo-editor-head span { display: block; margin-top: 4px; color: #6b7280; font-size: 13px; font-weight: 700; }
        .photo-editor-close { border: 0; width: 36px; height: 36px; border-radius: 999px; background: #f3f4f6; color: #4b5563; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; }
        .photo-editor-body { padding: 18px 20px 20px; }
        .photo-editor-stage { height: min(58vh, 460px); border-radius: 18px; background: #111827; display: flex; align-items: center; justify-content: center; overflow: hidden; border: 1px solid #d8dee9; touch-action: none; }
        .photo-editor-crop-box { position: relative; width: min(72vw, 380px); aspect-ratio: 1 / 1; overflow: hidden; border-radius: 18px; background: #f8fafc; box-shadow: 0 0 0 999px rgba(15, 23, 42, 0.46), 0 0 0 2px rgba(255, 255, 255, 0.96); cursor: grab; }
        .photo-editor-crop-box.dragging { cursor: grabbing; }
        .photo-editor-crop-box img { position: absolute; left: 50%; top: 50%; max-width: none; max-height: none; transform-origin: center center; user-select: none; -webkit-user-drag: none; will-change: transform; }
        .photo-editor-grid { position: absolute; inset: 0; pointer-events: none; background-image: linear-gradient(to right, rgba(255,255,255,.44) 1px, transparent 1px), linear-gradient(to bottom, rgba(255,255,255,.44) 1px, transparent 1px); background-size: 33.333% 100%, 100% 33.333%; }
        .photo-editor-actions { margin-top: 16px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
        .photo-editor-actions button { border: 0; border-radius: 999px; min-height: 42px; padding: 0 15px; display: inline-flex; align-items: center; gap: 8px; font-weight: 900; cursor: pointer; background: #f3f4f6; color: #374151; }
        .photo-editor-actions button:hover { background: #e5e7eb; }
        .photo-editor-actions .primary { margin-left: auto; background: var(--upload-accent); color: #fff; }
        .photo-editor-actions .primary:hover { filter: brightness(0.96); }
        .photo-editor-range { flex: 1 1 180px; min-height: 42px; padding: 0 14px; border-radius: 999px; background: #f3f4f6; display: flex; align-items: center; gap: 10px; color: #374151; font-weight: 900; }
        .photo-editor-range input { width: 100%; accent-color: var(--upload-accent); }
        @media (max-width: 640px) {
            .upload-thumb-card { flex-basis: 108px; width: 108px; }
            .photo-editor-actions .primary { margin-left: 0; width: 100%; justify-content: center; } .photo-editor-range { flex-basis: 100%; }
        }
        .empty-select-alert { padding: 16px; border-radius: 16px; background: #fff7ed; color: #c2410c; font-size: 14px; font-weight: 800; line-height: 1.5; }
        .form-error-alert { margin-bottom: 22px; padding: 14px 16px; border-radius: 16px; background: #eff6ff; color: #1d4ed8; font-size: 14px; font-weight: 900; display: flex; align-items: center; gap: 9px; }
        .form-error-alert[hidden] { display: none; }
        .form-group.field-invalid .input,
        .form-group.field-invalid .select,
        .form-group.field-invalid .textarea,
        .form-group.field-invalid .upload-box { border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12); }
        .form-group.field-invalid > label { color: #1d4ed8; }
.current-photo-preview {
            display: none !important;
        }

        .upload-preview.active {
            display: block;
        }

        .upload-file-list {
            display: flex !important;
            flex-direction: row !important;
            flex-wrap: nowrap !important;
            gap: 12px !important;
            overflow-x: auto !important;
            overflow-y: hidden !important;

            width: 132px !important;
            min-height: 176px;
            border-radius: 18px;

            width: 100% !important;
            aspect-ratio: 1 / 1 !important;
            height: auto !important;
            display: block;
            object-fit: cover;
            background: #f8fafc;
        }

        .upload-thumb-name {
            display: block;
            padding: 10px 10px 12px;
            color: #111827;
            font-size: 12px;
            font-weight: 900;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .upload-thumb-meta {
            display: none !important;
        }

        .upload-main-badge {
            position: absolute;
            top: 8px;
            left: 8px;
            border-radius: 999px;
            padding: 6px 9px;
            background: var(--upload-accent);
            color: #fff;
            font-size: 12px;
            font-weight: 950;
            box-shadow: 0 8px 18px rgba(15, 23, 42, 0.14);
        }

        .upload-remove-button {
            position: absolute;
            top: 8px;
            right: 8px;
            width: 30px;
            height: 30px;
            border-radius: 999px;
            border: 0;
            background: rgba(255, 255, 255, 0.92);
            color: var(--upload-accent);
            font-weight: 950;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 8px 18px rgba(15, 23, 42, 0.12);
        }

        .upload-order-buttons {
            position: absolute;
            left: 8px;
            right: 8px;
            bottom: 42px;
            display: flex;
            justify-content: space-between;
            pointer-events: none;
        }

        .upload-order-button {
            pointer-events: auto;
            width: 28px;
            height: 28px;
            border-radius: 999px;
            border: 0;
            background: rgba(17, 24, 39, 0.72);
            color: #fff;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 8px 18px rgba(15, 23, 42, 0.16);
        }

        .upload-order-button:disabled {
            opacity: 0.28;
            cursor: default;
        }

        .photo-editor-actions .primary {
            margin-left: auto;
            min-width: 172px;
            justify-content: center;
            background: var(--upload-accent) !important;
            color: #fff !important;
            opacity: 1 !important;
            box-shadow: 0 14px 28px color-mix(in srgb, var(--upload-accent) 35%, transparent);
            border: 2px solid color-mix(in srgb, var(--upload-accent) 88%, #ffffff 12%);
        }

        .photo-editor-actions .primary:hover {
            filter: brightness(0.95);
            transform: translateY(-1px);
        }

        .photo-editor-actions .primary i {
            color: inherit !important;
        }
/* codex-v73-photo-editor-visible-save-start */
        .photo-editor-actions .primary {
            background: #4b5563 !important;
            color: #ffffff !important;
            border: 2px solid #374151 !important;
            opacity: 1 !important;
            box-shadow: 0 14px 28px rgba(17, 24, 39, 0.24) !important;
        }

        .photo-editor-actions .primary:hover {
            background: #374151 !important;

        .photo-editor-actions .primary:disabled {

            color: #ffffff !important;

/* codex-v123-found-write-banner-start */

        .found-form-tip {

            border-radius: 16px;
            background: #eff6ff;

        }
        @media (max-width: 640px) {
            .found-match-flow {
                padding: 26px 24px;

            }
            .found-match-flow-inner {
                align-items: flex-start;

        .found-match-flow.found-guide-panel {
            margin: 28px 0 28px !important;

            border-radius: 26px !important;
            background: linear-gradient(135deg, #4f65e9, #3656dc) !important;
            color: #ffffff !important;

        .found-match-flow.found-guide-panel .found-match-flow-inner {

        .found-match-flow.found-guide-panel .found-match-flow-icon {

        }

        .found-match-flow.found-guide-panel .found-match-flow-title {

        @media (max-width: 640px) {

<body>

<div th:replace="~{fragments/header :: header}"></div>

<div class="container">
    <div class="page-title">
        <h1 th:text="${editMode == true ? '습득물 수정' : '습득물 등록'}">습득물 등록</h1>
    </div>

    <section class="found-match-flow found-guide-panel">
        <div class="found-match-flow-inner">
            <div class="found-match-flow-icon"><i class="fa-solid fa-wand-magic-sparkles"></i></div>
            <div>
                <div class="found-match-flow-title">&#49845;&#46301; &#51221;&#48372;&#47484; &#51088;&#49464;&#55176; &#51201;&#51004;&#47732; &#51452;&#51064;&#51012; &#45908; &#48744;&#47532; &#52286;&#51012; &#49688; &#51080;&#49845;&#45768;&#45796;</div>
                <div class="found-match-flow-desc">&#49845;&#46301; &#51109;&#49548;, &#48372;&#44288; &#51109;&#49548;, &#49324;&#51652; &#51221;&#48372;&#47484; &#54632;&#44760; &#46321;&#47197;&#54644; &#51452;&#49464;&#50836;.</div>
            </div>
        </div>
    </section>
    <form th:action="${editMode == true} ? @{/found/edit/{id}(id=${item.id})} : @{/found/write}"
          method="post"
          enctype="multipart/form-data"
          class="form-card"
          novalidate
          id="foundForm"
          th:attr="data-error-field=${errorField}">
<div class="form-error-alert" th:if="${error != null}">
            <i class="fa-solid fa-circle-exclamation"></i>
            <span th:text="${error}">입력값을 확인해 주세요.</span>
        </div>
        <div class="form-error-alert" id="foundClientError" hidden>
            <i class="fa-solid fa-circle-exclamation"></i>
            <span>필수 항목을 입력해 주세요.</span>
        </div>

        <div class="section-title">
            <div class="section-icon"><i class="fa-solid fa-box-open"></i></div>
            <h2>물건 정보</h2>
        </div>

        <div class="form-group">
            <label>제목 <span class="required">*</span></label>
            <input type="text" name="title" class="input" placeholder="예: 검정 지갑 보관 중" th:value="${formData != null ? formData.title : (editMode == true ? item.title : '')}" required>
        </div>

        <div class="form-group">
            <label>물건명 <span class="required">*</span></label>
            <input type="text" name="itemName" class="input" placeholder="예: 지갑, 에어팟, 학생증" th:value="${formData != null ? formData.itemName : (editMode == true ? item.itemName : '')}" required>
        </div>

        <div class="form-group">
            <label>카테고리 <span class="required">*</span></label>
            <div class="empty-select-alert" th:if="${categories == null or #lists.isEmpty(categories)}">
                카테고리 정보를 불러오지 못했습니다.
            </div>
            <div class="category-list" th:if="${categories != null and not #lists.isEmpty(categories)}">
                <label th:each="category : ${categories}" th:if="${category.categoryName != '기타'}">
                    <input type="radio" name="categoryId" th:value="${category.categoryId}" th:checked="${formData != null ? formData.categoryId == category.categoryId : (editMode == true and item.categoryId == category.categoryId)}" required>
                    <span th:text="${category.categoryName}">카테고리</span>
                </label>
                <label th:each="category : ${categories}" th:if="${category.categoryName == '기타'}">
                    <input type="radio" name="categoryId" th:value="${category.categoryId}" th:checked="${formData != null ? formData.categoryId == category.categoryId : (editMode == true and item.categoryId == category.categoryId)}" required>
                    <span th:text="${category.categoryName}">카테고리</span>
                </label>
            </div>
        </div>

        <div class="feature-grid">
            <div class="form-group">
                <label>색상 <span class="optional">선택</span></label>
                <input type="text" name="color" class="input" placeholder="예: 검정" th:value="${formData != null ? formData.color : (editMode == true ? item.color : '')}">
            </div>

            <div class="form-group">
                <label>브랜드 <span class="optional">선택</span></label>
                <input type="text" name="brand" class="input" placeholder="예: Apple" th:value="${formData != null ? formData.brand : (editMode == true ? item.brand : '')}">
            </div>
        </div>

        <div class="form-group">
            <label>물건 사진 <span class="optional">선택</span></label>
            <label class="upload-box">
                <input type="file" name="images" id="foundImages" multiple hidden accept="image/*"
                       th:attr="data-existing-url=${editMode == true and item.imageUrl != null ? item.imageUrl : ''}, data-existing-name=${editMode == true and item.imageUrl != null ? '현재 대표 사진' : ''}">
                <i class="fa-solid fa-cloud-arrow-up"></i>
                <strong>사진을 클릭해서 업로드</strong>
                <span>여러 장 업로드 가능 · 첫 번째 사진이 대표 사진으로 표시됩니다.</span>
            </label>
            <div class="current-photo-preview" th:if="${editMode == true and item.imageUrl != null}">
                <div class="current-photo-card">
                    <img th:src="@{${item.imageUrl}}" alt="습득물 현재 사진">
                    <div class="current-photo-label">현재 대표 사진</div>
                </div>
            </div>

            <div class="upload-preview" id="foundImagePreview">
                <div class="upload-preview-title" id="foundImageCount">선택된 사진 0장 · 첫 번째 사진이 대표 사진</div>
                <div class="upload-file-list" id="foundImageList"></div>
            </div>
        </div>

        <div class="form-group">
            <label>상세 설명 <span class="optional">선택</span></label>
            <textarea name="description" class="textarea" placeholder="예: 중앙도서관 1층에서 지갑을 습득했습니다." th:text="${formData != null ? formData.description : (editMode == true ? item.description : '')}"></textarea>
        </div>

        <div class="section-title">
            <div class="section-icon"><i class="fa-solid fa-location-dot"></i></div>
            <h2>습득 위치</h2>
        </div>

        <div class="form-group">
            <label>습득 위치 <span class="required">*</span></label>
            <select name="foundLocationName" class="select" required>
                <option value="">&#50948;&#52824;&#47484; &#49440;&#53469;&#54616;&#49464;&#50836;</option>
                <option th:each="locationName : ${locationOptions}"
                        th:value="${locationName}"
                        th:selected="${formData != null ? formData.foundLocationName == locationName : (editMode == true and item.locationName == locationName)}"
                        th:text="${locationName}">
                    location
                </option>
            </select>
        </div>

        <div class="row">
            <div class="form-group">
                <label>상세 위치 <span class="optional">선택</span></label>
                <input type="text" name="foundLocationDetail" class="input" placeholder="예: 1층 로비" th:value="${formData != null ? formData.foundLocationDetail : (editMode == true ? item.locationDetail : '')}">
            </div>

            <div class="form-group">
                <label>습득 날짜 <span class="required">*</span></label>
                <input type="date" name="foundDate" class="input" th:value="${formData != null ? formData.foundDate : (editMode == true and item.itemDate != null ? #dates.format(item.itemDate, 'yyyy-MM-dd') : '')}">
            </div>
        </div>

        <div class="form-group">
            <label>습득 시간 <span class="optional">선택</span></label>
            <input type="time" name="foundTime" class="input" th:value="${formData != null ? formData.foundTime : (editMode == true ? item.itemTime : '')}">
        </div>

        <div class="section-title">
            <div class="section-icon"><i class="fa-solid fa-building-columns"></i></div>
            <h2>보관 정보</h2>
        </div>

        <div class="form-group">
            <label>보관 또는 인계 상태 <span class="required">*</span></label>
            <div class="handover-status">
                <label>
                    <input type="radio" name="handoverStatus" value="PLANNED" th:checked="${formData != null and formData.handoverStatus == 'PLANNED'}" required>
                    <div class="handover-card">
                        <i class="fa-solid fa-clock"></i>
                        <div>
                            <strong>인계 예정</strong>
                            <span>등록 후 보관처에 인계할 예정입니다.</span>
                        </div>
                    </div>
                </label>

                <label>
                    <input type="radio" name="handoverStatus" value="COMPLETED" th:checked="${formData != null ? formData.handoverStatus == 'COMPLETED' : editMode == true}">
                    <div class="handover-card">
                        <i class="fa-solid fa-circle-check"></i>
                        <div>
                            <strong>이미 인계</strong>
                            <span>이미 지정 보관처에 맡겼습니다.</span>
                        </div>
                    </div>
                </label>
            </div>
        </div>

        <div class="form-group">
            <label>인계 장소 <span class="required">*</span></label>
            <select name="storageId" class="select">
                <option value="">인계 장소를 선택하세요</option>
                <option th:each="storage : ${storagePlaces}" th:value="${storage.storageId}"
                        th:selected="${formData != null ? formData.storageId == storage.storageId : (editMode == true and item.storageId == storage.storageId)}"
                        th:text="${storage.storageName}">
                    보관소
                </option>
            </select>
            <p class=\"field-help\">학과사무실에 인계한 경우 목록에서 해당 학과사무실을 선택해 주세요. 수령 안내에서는 해당 학과사무실 연락처가 표시됩니다.</p>
        </div>

        <div class="button-area">
            <a th:href="${editMode == true} ? @{/mypage} : @{/found/list}" class="cancel-btn">취소</a>
            <button type="submit" class="submit-btn">
                <i class="fa-solid fa-check"></i>
                <span th:text="${editMode == true ? '습득물 수정하기' : '습득물 등록하기'}">습득물 등록하기</span>
            </button>
        </div>
    </form>
</div>

<script>
    function bindImagePreview(inputId, previewId, countId, listId) {
        const input = document.getElementById(inputId);
        const preview = document.getElementById(previewId);
        const count = document.getElementById(countId);
        const list = document.getElementById(listId);
        if (!input || !preview || !count || !list) return;

        const selectedFiles = [];
        const objectUrls = new WeakMap();
        let existingImported = false;

        function getObjectUrl(file) {
            if (!objectUrls.has(file)) {
                objectUrls.set(file, URL.createObjectURL(file));
            }
            return objectUrls.get(file);
        }

        function revokeFileUrl(file) {
            const url = objectUrls.get(file);
            if (url) {
                URL.revokeObjectURL(url);
                objectUrls.delete(file);
            }
        }

        function syncInputFiles() {
            const dataTransfer = new DataTransfer();
            selectedFiles.forEach((file) => dataTransfer.items.add(file));
            input.files = dataTransfer.files;
        }

        function shortName(file, index) {
            const raw = file.displayName || file.name || `사진 ${index + 1}`;
            return index === 0 ? `대표 · ${raw}` : raw;
        }

        function moveFile(from, to) {
            if (to < 0 || to >= selectedFiles.length || from === to) return;
            const [file] = selectedFiles.splice(from, 1);
            selectedFiles.splice(to, 0, file);
            syncInputFiles();
            renderFiles();
        }

        function renderFiles() {
            list.innerHTML = "";

            if (selectedFiles.length === 0) {
                preview.classList.remove("active");
                count.textContent = "";
                syncInputFiles();
                return;
            }

            preview.classList.add("active");
            count.textContent = `선택된 사진 ${selectedFiles.length}장 · 첫 번째 사진이 대표 사진`;

            selectedFiles.forEach((file, index) => {
                const card = document.createElement("button");
                card.type = "button";
                card.className = "upload-thumb-card";
                card.title = "사진 편집";

                const image = document.createElement("img");
                image.src = getObjectUrl(file);
                image.alt = file.name || "선택한 사진";

                const name = document.createElement("span");
                name.className = "upload-thumb-name";
                name.textContent = shortName(file, index);

                const removeButton = document.createElement("button");
                removeButton.type = "button";
                removeButton.className = "upload-remove-button";
                removeButton.innerHTML = '<i class="fa-solid fa-xmark"></i>';
                removeButton.setAttribute("aria-label", "사진 삭제");
                removeButton.addEventListener("click", (event) => {
                    event.stopPropagation();
                    const [removed] = selectedFiles.splice(index, 1);
                    revokeFileUrl(removed);
                    syncInputFiles();
                    renderFiles();
                });

                const orderButtons = document.createElement("div");
                orderButtons.className = "upload-order-buttons";

                const leftButton = document.createElement("button");
                leftButton.type = "button";
                leftButton.className = "upload-order-button";
                leftButton.innerHTML = '<i class="fa-solid fa-chevron-left"></i>';
                leftButton.disabled = index === 0;
                leftButton.setAttribute("aria-label", "앞으로 이동");
                leftButton.addEventListener("click", (event) => {
                    event.stopPropagation();
                    moveFile(index, index - 1);
                });

                const rightButton = document.createElement("button");
                rightButton.type = "button";
                rightButton.className = "upload-order-button";
                rightButton.innerHTML = '<i class="fa-solid fa-chevron-right"></i>';
                rightButton.disabled = index === selectedFiles.length - 1;
                rightButton.setAttribute("aria-label", "뒤로 이동");
                rightButton.addEventListener("click", (event) => {
                    event.stopPropagation();
                    moveFile(index, index + 1);
                });

                orderButtons.appendChild(leftButton);
                orderButtons.appendChild(rightButton);

                if (index === 0) {
                    const badge = document.createElement("span");
                    badge.className = "upload-main-badge";
                    badge.textContent = "대표";
                    card.appendChild(badge);
                }

                card.appendChild(image);
                card.appendChild(name);
                card.appendChild(removeButton);
                card.appendChild(orderButtons);
                card.addEventListener("click", () => openPhotoEditor(file, index));
                list.appendChild(card);
            });
        }

        function createPhotoEditor() {
            let backdrop = document.querySelector(".photo-editor-backdrop");
            if (!backdrop) {
                backdrop = document.createElement("div");
                backdrop.className = "photo-editor-backdrop";
                backdrop.innerHTML =
                    '<div class="photo-editor-panel" role="dialog" aria-modal="true" aria-label="사진 편집">' +
                    '  <div class="photo-editor-head">' +
                    '    <div><strong>사진 편집</strong><span>정사각형 영역에 맞춰 대표 이미지를 정리합니다.</span></div>' +
                    '    <button type="button" class="photo-editor-close" aria-label="닫기"><i class="fa-solid fa-xmark"></i></button>' +
                    '  </div>' +
                    '  <div class="photo-editor-body">' +
                    '    <div class="photo-editor-stage">' +
                    '      <div class="photo-editor-crop-box">' +
                    '        <img alt="편집 중인 사진">' +
                    '        <div class="photo-editor-grid"></div>' +
                    '      </div>' +
                    '    </div>' +
                    '    <div class="photo-editor-actions">' +
                    '      <button type="button" data-action="rotate-left"><i class="fa-solid fa-rotate-left"></i>왼쪽 회전</button>' +
                    '      <button type="button" data-action="rotate-right"><i class="fa-solid fa-rotate-right"></i>오른쪽 회전</button>' +
                    '      <label class="photo-editor-range"><i class="fa-solid fa-magnifying-glass-plus"></i><input type="range" min="1" max="2.4" step="0.05" value="1" data-action="zoom"></label>' +
                    '      <button type="button" data-action="reset"><i class="fa-solid fa-arrow-rotate-left"></i>초기화</button>' +
                    '      <button type="button" class="primary" data-action="apply"><i class="fa-solid fa-check"></i>사진 저장하기</button>' +
                    '    </div>' +
                    '  </div>' +
                    '</div>';
                document.body.appendChild(backdrop);
            }

            return {
                backdrop,
                cropBox: backdrop.querySelector(".photo-editor-crop-box"),
                image: backdrop.querySelector(".photo-editor-crop-box img"),
                close: backdrop.querySelector(".photo-editor-close"),
                zoom: backdrop.querySelector('[data-action="zoom"]'),
                rotateLeft: backdrop.querySelector('[data-action="rotate-left"]'),
                rotateRight: backdrop.querySelector('[data-action="rotate-right"]'),
                reset: backdrop.querySelector('[data-action="reset"]'),
                apply: backdrop.querySelector('[data-action="apply"]')
            };
        }

        function openPhotoEditor(file, index) {
            const editor = createPhotoEditor();
            let rotation = 0;
            let scale = 1;
            let offsetX = 0;
            let offsetY = 0;
            let dragging = false;
            let dragStartX = 0;
            let dragStartY = 0;
            let startX = 0;
            let startY = 0;

            function updateTransform() {
                editor.image.style.transform = `translate(-50%, -50%) translate(${offsetX}px, ${offsetY}px) rotate(${rotation}deg) scale(${scale})`;
            }

            function resetState() {
                rotation = 0;
                scale = 1;
                offsetX = 0;
                offsetY = 0;
                editor.zoom.value = "1";
                updateTransform();
            }

            function closeEditor() {
                editor.backdrop.classList.remove("active");
                editor.image.removeAttribute("src");
            }

            function canvasFromEditedImage() {
                const size = 900;
                const canvas = document.createElement("canvas");
                canvas.width = size;
                canvas.height = size;
                const ctx = canvas.getContext("2d");
                ctx.fillStyle = "#f8fafc";
                ctx.fillRect(0, 0, size, size);

                const image = editor.image;
                const box = editor.cropBox.getBoundingClientRect();
                const naturalWidth = image.naturalWidth || 1;
                const naturalHeight = image.naturalHeight || 1;
                const baseScale = Math.max(box.width / naturalWidth, box.height / naturalHeight);
                const renderScale = baseScale * scale * (size / box.width);

                ctx.save();
                ctx.translate(size / 2 + offsetX * (size / box.width), size / 2 + offsetY * (size / box.width));
                ctx.rotate(rotation * Math.PI / 180);
                ctx.scale(renderScale, renderScale);
                ctx.drawImage(image, -naturalWidth / 2, -naturalHeight / 2);
                ctx.restore();

                return new Promise((resolve) => canvas.toBlob(resolve, "image/jpeg", 0.92));
            }

            editor.image.onload = () => {
                const box = editor.cropBox.getBoundingClientRect();
                const fit = Math.max(box.width / editor.image.naturalWidth, box.height / editor.image.naturalHeight);
                editor.image.style.width = `${editor.image.naturalWidth * fit}px`;
                editor.image.style.height = `${editor.image.naturalHeight * fit}px`;
                resetState();
            };
            editor.image.src = getObjectUrl(file);
            editor.backdrop.classList.add("active");

            editor.rotateLeft.onclick = () => { rotation -= 90; updateTransform(); };
            editor.rotateRight.onclick = () => { rotation += 90; updateTransform(); };
            editor.reset.onclick = resetState;
            editor.zoom.oninput = () => { scale = Number(editor.zoom.value); updateTransform(); };
            editor.close.onclick = closeEditor;
            editor.backdrop.onclick = (event) => {
                if (event.target === editor.backdrop) closeEditor();
            };

            editor.cropBox.onpointerdown = (event) => {
                dragging = true;
                editor.cropBox.classList.add("dragging");
                dragStartX = event.clientX;
                dragStartY = event.clientY;
                startX = offsetX;
                startY = offsetY;
                editor.cropBox.setPointerCapture(event.pointerId);
            };
            editor.cropBox.onpointermove = (event) => {
                if (!dragging) return;
                offsetX = startX + event.clientX - dragStartX;
                offsetY = startY + event.clientY - dragStartY;
                updateTransform();
            };
            editor.cropBox.onpointerup = () => {
                dragging = false;
                editor.cropBox.classList.remove("dragging");
            };
            editor.cropBox.onpointercancel = editor.cropBox.onpointerup;

            editor.apply.onclick = () => {
                const button = editor.apply;
                button.disabled = true;
                button.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>저장 중';

                canvasFromEditedImage()
                    .then((blob) => {
                        if (!blob) return;
                        const originalName = file.name || `photo-${index + 1}.jpg`;
                        const editedName = originalName.replace(/\.[^.]+$/, "") + "-edited.jpg";
                        const editedFile = new File([blob], editedName, { type: "image/jpeg", lastModified: Date.now() });
                        editedFile.displayName = file.displayName || editedName;
                        revokeFileUrl(file);
                        selectedFiles[index] = editedFile;
                        syncInputFiles();
                        renderFiles();
                        closeEditor();
                    })
                    .finally(() => {
                        button.disabled = false;
                        button.innerHTML = '<i class="fa-solid fa-check"></i>사진 저장하기';
                    });
            };
        }

        function fileNameFromUrl(url) {
            try {
                const last = decodeURIComponent(url.split("?")[0].split("/").filter(Boolean).pop() || "현재-대표-사진.jpg");
                return last.includes(".") ? last : `${last}.jpg`;
            } catch (error) {
                return "현재-대표-사진.jpg";
            }
        }

        function importExistingImage() {
            const existingUrl = (input.dataset.existingUrl || "").trim();
            if (!existingUrl || existingImported) return;
            existingImported = true;

            fetch(existingUrl, { cache: "no-store" })
                .then((response) => {
                    if (!response.ok) throw new Error("기존 사진을 불러오지 못했습니다.");
                    return response.blob();
                })
                .then((blob) => {
                    if (!blob || !blob.type || !blob.type.startsWith("image/")) return;
                    const name = fileNameFromUrl(existingUrl);
                    const file = new File([blob], name, { type: blob.type, lastModified: Date.now() });
                    file.displayName = input.dataset.existingName || "현재 대표 사진";
                    selectedFiles.push(file);
                    syncInputFiles();
                    renderFiles();
                })
                .catch(() => {
                    preview.classList.remove("active");
                });
        }

        input.addEventListener("change", () => {
            Array.from(input.files || []).forEach((file) => {
                if (file && file.type && file.type.startsWith("image/")) {
                    selectedFiles.push(file);
                }
            });
            syncInputFiles();
            renderFiles();
        });

        importExistingImage();
    }

    bindImagePreview("foundImages", "foundImagePreview", "foundImageCount", "foundImageList");

    function focusInvalidField(fieldName) {
        if (!fieldName) return;

        const fields = document.querySelectorAll('[name="' + fieldName + '"]');
        if (!fields.length) return;

        const target = fields[0];
        const group = target.closest(".form-group") || target.closest(".handover-status") || target;
        document.querySelectorAll(".field-invalid").forEach(function (item) {
            item.classList.remove("field-invalid");
        });
        if (group.classList) {
            group.classList.add("field-invalid");
        }

        group.scrollIntoView({ behavior: "smooth", block: "center" });
        window.setTimeout(function () {
            if (target.type !== "radio" && target.type !== "file") {
                target.focus({ preventScroll: true });
            }
        }, 350);
    }

    function getRequiredValue(form, fieldName) {
        const fields = Array.from(form.querySelectorAll('[name="' + fieldName + '"]'));
        if (!fields.length) return "";

        if (fields[0].type === "radio") {
            return fields.some(function (field) { return field.checked; }) ? "checked" : "";
        }

        return (fields[0].value || "").trim();
    }

    function findMissingRequiredField(form) {
        const requiredFields = [
            { name: "title", label: "제목" },
            { name: "itemName", label: "물건명" },
            { name: "categoryId", label: "카테고리" },
            { name: "foundLocationName", label: "습득 위치" },
            { name: "foundDate", label: "습득 날짜" },
            { name: "handoverStatus", label: "보관 또는 인계 상태" },
            { name: "storageId", label: "보관 장소" }
        ];

        return requiredFields.find(function (field) {
            return !getRequiredValue(form, field.name);
        });
    }

    function showClientError(message) {
        const errorBox = document.getElementById("foundClientError");
        if (!errorBox) return;
        errorBox.querySelector("span").textContent = message;
        errorBox.hidden = false;
    }

    document.addEventListener("DOMContentLoaded", function () {
        const form = document.getElementById("foundForm");

        focusInvalidField(form.dataset.errorField || "");

        form.addEventListener("submit", function (event) {
            const missingField = findMissingRequiredField(form);
            if (!missingField) {
                return;
            }

            event.preventDefault();
            showClientError(missingField.label + " 항목을 입력해야 등록할 수 있습니다.");
            focusInvalidField(missingField.name);
        });
    });
</script>

</body>
</html>

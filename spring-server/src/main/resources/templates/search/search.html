<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>통합 검색 | FindCampus</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/search.css}">
</head>

<body>

<div th:replace="~{fragments/header :: header}"></div>

<div class="search-layout">

    <aside class="sidebar">

        <div class="search-panel-head">
            <div class="search-panel-icon">
                <i class="fa-solid fa-sliders"></i>
            </div>

            <div>
                <h2>상세 검색</h2>
                <p>조건을 선택해 물건을 빠르게 찾아보세요.</p>
            </div>
        </div>

        <form th:action="@{/search}" method="get">

            <div class="form-group">
                <label>키워드</label>

                <div class="keyword-box">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text"
                           name="keyword"
                           class="search-input"
                           th:value="${search != null ? search.keyword : ''}"
                           placeholder="물건명, 특징을 입력하세요">
                </div>
            </div>

            <div class="form-group">
                <label>카테고리</label>

                <select name="categoryId" class="select-box">
                    <option value="">전체 카테고리</option>
                    <option th:each="category : ${categories}"
                            th:value="${category.categoryId}"
                            th:text="${category.categoryName}"
                            th:selected="${search != null and search.categoryId == category.categoryId}">
                        전자기기
                    </option>
                </select>
            </div>

            <div class="form-group">
                <label>위치</label>

                <select name="locationName" class="select-box">
                    <option value="">전체 위치</option>
                    <option th:each="locationName : ${locationOptions}"
                            th:value="${locationName}"
                            th:text="${locationName}"
                            th:selected="${search != null and search.locationName == locationName}">
                        중앙도서관
                    </option>
                </select>
            </div>

            <div class="form-group">
                <label>상태</label>

                <select name="status" class="select-box">
                    <option value="">전체 상태</option>
                    <option value="REGISTERED" th:selected="${search != null and search.status == 'REGISTERED'}">접수중</option>
                    <option value="STORED" th:selected="${search != null and search.status == 'STORED'}">보관중</option>
                    <option value="RETURNED" th:selected="${search != null and search.status == 'RETURNED'}">반환완료</option>
                </select>
            </div>

            <div class="form-group">
                <label>정렬</label>

                <select name="sort" class="select-box">
                    <option value="latest" th:selected="${search == null or search.sort == null or search.sort == 'latest'}">최신순</option>
                    <option value="view" th:selected="${search != null and search.sort == 'view'}">조회순</option>
                    <option value="old" th:selected="${search != null and search.sort == 'old'}">오래된순</option>
                </select>
            </div>

            <button type="submit" class="search-btn">
                <i class="fa-solid fa-magnifying-glass"></i>
                검색하기
            </button>

        </form>

    </aside>

    <main class="content">

        <section class="search-hero">

            <div>
                <span class="hero-badge">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    통합 검색
                </span>

                <h1>분실물과 습득물을 한 번에 찾아보세요</h1>

                <p>
                    물건명, 위치, 날짜 조건을 이용해 등록된 분실물과 습득물을 빠르게 확인할 수 있습니다.
                </p>
            </div>

            <div class="hero-count">
                <strong id="resultCount" th:text="${lostCount}">2</strong>
                <span>검색 결과</span>
            </div>

        </section>

        <div class="tab-menu">
            <button type="button" class="active" data-filter="lost" th:text="|분실물(${lostCount})|">분실물(2)</button>
            <button type="button" data-filter="found" th:text="|습득물(${foundCount})|">습득물(2)</button>
        </div>

        <div class="result-list">

                        <a th:each="item : ${lostItems}" th:href="@{/lost/detail/{id}(id=${item.id})}" class="result-item lost-item">
                <div class="thumb">
                    <span class="result-status received"
                          th:classappend="${item.status == 'RETURNED' ? ' returned' : ' received'}"
                          th:text="${item.status == 'RETURNED' ? '반환완료' : '접수중'}">접수중</span>
                    <img th:if="${item.imageUrl != null}" th:src="@{${item.imageUrl}}" alt="분실물 사진">
                    <i th:if="${item.imageUrl == null}" class="fa-solid fa-box-open"></i>
                </div>

                <div class="result-info">
                    <span class="item-type lost">분실물</span>
                    <h3 th:text="${item.title}">분실물 제목</h3>
                    <p class="result-desc"
                       th:text="${item.itemName + (item.color != null and item.color != '' ? ' · ' + item.color : '') + (item.brand != null and item.brand != '' ? ' · ' + item.brand : '')}">
                        물품명 · 색상 · 브랜드
                    </p>

                    <div class="result-meta">
                        <span><i class="fa-solid fa-location-dot"></i> <span th:text="${item.locationName != null ? item.locationName + (item.locationDetail != null and item.locationDetail != '' ? ' ' + item.locationDetail : '') : (item.locationDetail != null ? item.locationDetail : '위치 미입력')}">위치 미입력</span></span>
                        <span><i class="fa-regular fa-clock"></i> <span th:text="${item.itemDate != null ? #dates.format(item.itemDate, 'yyyy.MM.dd') : '날짜 미입력'}">날짜 미입력</span></span>
                        <span class="result-view-count"><i class="fa-regular fa-eye"></i> 조회수 <span th:text="${item.viewCount != null ? item.viewCount : 0}">0</span></span>
                    </div>
                </div>
            </a>

                        <a th:each="item : ${foundItems}" th:href="@{/found/detail/{id}(id=${item.id})}" class="result-item found-item hidden">
                <div class="thumb">
                    <span class="result-status storage"
                          th:classappend="${item.status == 'RETURNED' or item.status == 'COMPLETED' or item.status == '반환완료' ? ' returned' : ' storage'}"
                          th:text="${item.status == 'RETURNED' or item.status == 'COMPLETED' or item.status == '반환완료' ? '반환완료' : '보관중'}">보관중</span>
                    <img th:if="${item.imageUrl != null}" th:src="@{${item.imageUrl}}" alt="습득물 사진">
                    <i th:if="${item.imageUrl == null}" class="fa-solid fa-box-open"></i>
                </div>

                <div class="result-info">
                    <span class="item-type found">습득물</span>
                    <h3 th:text="${item.title}">습득물 제목</h3>
                    <p class="result-desc"
                       th:text="${item.itemName + (item.color != null and item.color != '' ? ' · ' + item.color : '') + (item.brand != null and item.brand != '' ? ' · ' + item.brand : '')}">
                        물품명 · 색상 · 브랜드
                    </p>

                    <div class="result-meta">
                        <span><i class="fa-solid fa-location-dot"></i> <span th:text="${item.locationName != null ? item.locationName + (item.locationDetail != null and item.locationDetail != '' ? ' ' + item.locationDetail : '') : (item.locationDetail != null ? item.locationDetail : '위치 미입력')}">위치 미입력</span></span>
                        <span><i class="fa-regular fa-clock"></i> <span th:text="${item.itemDate != null ? #dates.format(item.itemDate, 'yyyy.MM.dd') : '날짜 미입력'}">날짜 미입력</span></span>
                        <span class="result-view-count"><i class="fa-regular fa-eye"></i> 조회수 <span th:text="${item.viewCount != null ? item.viewCount : 0}">0</span></span>
                    </div>
                </div>
            </a>

        </div>

    </main>

</div>

<script>
    document.addEventListener("DOMContentLoaded", function () {
        const tabButtons = document.querySelectorAll(".tab-menu button");
        const lostItems = document.querySelectorAll(".lost-item");
        const foundItems = document.querySelectorAll(".found-item");
        const resultCount = document.getElementById("resultCount");

        function showLostItems() {
            lostItems.forEach(function (item) {
                item.classList.remove("hidden");
            });

            foundItems.forEach(function (item) {
                item.classList.add("hidden");
            });

            resultCount.textContent = lostItems.length;
        }

        function showFoundItems() {
            foundItems.forEach(function (item) {
                item.classList.remove("hidden");
            });

            lostItems.forEach(function (item) {
                item.classList.add("hidden");
            });

            resultCount.textContent = foundItems.length;
        }

        tabButtons.forEach(function (button) {
            button.addEventListener("click", function () {
                tabButtons.forEach(function (btn) {
                    btn.classList.remove("active");
                });

                button.classList.add("active");

                const filter = button.getAttribute("data-filter");

                if (filter === "lost") {
                    showLostItems();
                }

                if (filter === "found") {
                    showFoundItems();
                }
            });
        });

        showLostItems();
    });
</script>

</body>
</html>

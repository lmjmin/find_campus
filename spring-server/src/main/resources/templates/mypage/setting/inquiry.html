<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>&#47928;&#51032;&#54616;&#44592; | FindCampus</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/mypage/setting/setting.css}">
    <link rel="stylesheet" th:href="@{/css/mypage/setting/inquiry.css}">
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>
<div class="setting-detail-page">
    <div class="setting-detail-container">
        <div class="setting-detail-header"><button type="button" class="setting-back-btn" onclick="location.href='/mypage/setting'"><i class="fa-solid fa-chevron-left"></i></button><div class="setting-detail-title-box"><h1>&#47928;&#51032;&#54616;&#44592;</h1><p>&#44396;&#44552;&#54620; &#51216;&#51060;&#45208; &#48520;&#54200;&#54620; &#51216;&#51012; &#45224;&#44200;&#51452;&#49464;&#50836;.</p></div></div>
        <div class="setting-detail-card inquiry-card">
            <div class="inquiry-message success" th:if="${inquiryMessage != null}" th:text="${inquiryMessage}"></div>
            <div class="inquiry-message error" th:if="${inquiryError != null}" th:text="${inquiryError}"></div>
            <form id="inquiryForm" class="inquiry-form" th:action="@{/mypage/setting/inquiry}" th:object="${inquiry}" method="post">
                <div class="inquiry-form-group"><label for="inquiryType">&#47928;&#51032; &#50976;&#54805;</label><select id="inquiryType" th:field="*{inquiryType}" required><option value="">&#47928;&#51032; &#50976;&#54805;&#51012; &#49440;&#53469;&#54644;&#51452;&#49464;&#50836;</option><option value="lost">&#48516;&#49892;&#47932; &#47928;&#51032;</option><option value="found">&#49845;&#46301;&#47932; &#47928;&#51032;</option><option value="match">&#50976;&#49324; &#47932;&#44148; &#52628;&#52380; &#47928;&#51032;</option><option value="report">&#49888;&#44256; &#44288;&#47144; &#47928;&#51032;</option><option value="etc">&#44592;&#53440; &#47928;&#51032;</option></select></div>
                <div class="inquiry-form-group"><label for="title">&#51228;&#47785;</label><input type="text" id="title" th:field="*{title}" placeholder="&#47928;&#51032; &#51228;&#47785;&#51012; &#51077;&#47141;&#54644;&#51452;&#49464;&#50836;" required></div>
                <div class="inquiry-form-group"><label for="content">&#47928;&#51032; &#45236;&#50857;</label><textarea id="content" th:field="*{content}" placeholder="&#54869;&#51064;&#51060; &#54596;&#50836;&#54620; &#45236;&#50857;&#51012; &#51089;&#49457;&#54644;&#51452;&#49464;&#50836;" required></textarea></div>
                <div class="inquiry-button-area"><button type="submit" class="inquiry-submit-btn">&#47928;&#51032; &#51217;&#49688;</button></div>
            </form>
        </div>
        <section id="inquiryHistory" class="setting-detail-card inquiry-history-card">
            <div class="inquiry-history-head"><h2>&#45236; &#47928;&#51032; &#45236;&#50669;</h2><span th:text="|${#lists.size(userInquiries)}&#44148;|">0&#44148;</span></div>
            <div class="inquiry-history-empty" th:if="${#lists.isEmpty(userInquiries)}">&#50500;&#51649; &#46321;&#47197;&#54620; &#47928;&#51032;&#44032; &#50630;&#49845;&#45768;&#45796;.</div>
            <article class="user-inquiry-card" th:each="item : ${userInquiries}">
                <div class="user-inquiry-top"><h3 th:text="${item.title}">&#47928;&#51032; &#51228;&#47785;</h3><span class="status-badge waiting" th:if="${item.status == null or item.status == 'WAITING'}">&#45813;&#48320; &#45824;&#44592;</span><span class="status-badge answered" th:if="${item.status == 'ANSWERED'}">&#45813;&#48320; &#50756;&#47308;</span></div>
                <div class="user-inquiry-meta"><span th:text="${#dates.format(item.createdAt, 'yyyy.MM.dd')}">2026.08.11</span></div>
                <p class="user-inquiry-content" th:text="${item.content}">&#47928;&#51032; &#45236;&#50857;</p>
                <div class="user-inquiry-answer" th:if="${item.status == 'ANSWERED'}"><strong>&#44288;&#47532;&#51088; &#45813;&#48320;</strong><p th:text="${item.answerContent}">&#45813;&#48320; &#45236;&#50857;</p><span th:if="${item.answeredAt != null}" th:text="${#dates.format(item.answeredAt, 'yyyy.MM.dd HH:mm')}">-</span></div>
            </article>
        </section>
    </div>
</div>
<script th:inline="javascript">
document.addEventListener("DOMContentLoaded", function () {
    const shouldFocus = /*[[${focusInquiryForm == true}]]*/ false;
    if (!shouldFocus) return;
    const fields = [document.getElementById("inquiryType"), document.getElementById("title"), document.getElementById("content")];
    const target = fields.find((field) => field && !field.value.trim());
    if (target) {
        target.scrollIntoView({ behavior: "smooth", block: "center" });
        target.focus({ preventScroll: true });
    }
});
</script>
</body>
</html>

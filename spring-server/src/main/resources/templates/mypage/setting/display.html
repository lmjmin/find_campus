<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>화면 설정 | FindCampus</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <link rel="stylesheet" th:href="@{/css/common.css(v=${#dates.createNow().time})}">
    <link rel="stylesheet" th:href="@{/css/mypage/setting/setting.css(v=${#dates.createNow().time})}">
    <link rel="stylesheet" th:href="@{/css/mypage/setting/display.css(v=${#dates.createNow().time})}">
</head>

<body>

<div th:replace="~{fragments/header :: header}"></div>

<div class="setting-detail-page">

    <div class="setting-detail-container">

        <div class="setting-detail-header">
            <button type="button" class="setting-back-btn" onclick="location.href='/mypage/setting'">
                <i class="fa-solid fa-chevron-left"></i>
            </button>

            <div class="setting-detail-title-box">
                <h1>화면 설정</h1>
                <p>FindCampus 화면 표시 방식과 글자 크기를 설정할 수 있습니다.</p>
            </div>
        </div>

        <div class="setting-detail-card display-card">

            <section class="display-section">
                <div class="display-section-head">
                    <div class="display-section-icon blue">
                        <i class="fa-solid fa-circle-half-stroke"></i>
                    </div>

                    <div class="display-section-title">
                        <h2>화면 모드</h2>
                        <p>사용 환경에 맞게 밝은 화면 또는 어두운 화면을 선택할 수 있습니다.</p>
                    </div>
                </div>

                <div class="option-list">

                    <label class="option-item">
                        <div class="option-left">
                            <div class="option-icon yellow">
                                <i class="fa-regular fa-sun"></i>
                            </div>

                            <div class="option-text">
                                <strong>라이트 모드</strong>
                                <span>밝은 배경으로 기본 화면을 표시합니다.</span>
                            </div>
                        </div>

                        <input type="radio" name="theme" value="light" class="radio" checked>
                    </label>

                    <label class="option-item">
                        <div class="option-left">
                            <div class="option-icon purple">
                                <i class="fa-regular fa-moon"></i>
                            </div>

                            <div class="option-text">
                                <strong>다크 모드</strong>
                                <span>어두운 배경으로 눈의 피로를 줄입니다.</span>
                            </div>
                        </div>

                        <input type="radio" name="theme" value="dark" class="radio">
                    </label>

                </div>
            </section>

            <section class="display-section">
                <div class="display-section-head">
                    <div class="display-section-icon green">
                        <i class="fa-solid fa-text-height"></i>
                    </div>

                    <div class="display-section-title">
                        <h2>글자 크기</h2>
                        <p>목록, 게시글, 안내 문구의 글자 크기를 조절할 수 있습니다.</p>
                    </div>
                </div>

                <div class="font-size-box">
                    <button type="button" class="size-btn size-small" data-size="small">
                        작게
                    </button>

                    <button type="button" class="size-btn size-normal active" data-size="medium">
                        보통
                    </button>

                    <button type="button" class="size-btn size-large" data-size="large">
                        크게
                    </button>
                </div>
            </section>

            <div class="display-button-area">
                <button type="button" class="display-save-btn" id="saveBtn">
                    <i class="fa-solid fa-check"></i>
                    설정 저장
                </button>
            </div>

        </div>

    </div>

</div>

<script>
    document.addEventListener("DOMContentLoaded", function () {
        const storageKey = "findCampusDisplaySettings";
        const defaultSettings = {
            theme: "light",
            fontSize: "medium"
        };
        const themeRadios = document.querySelectorAll("input[name='theme']");
        const sizeButtons = document.querySelectorAll(".size-btn");
        const saveBtn = document.getElementById("saveBtn");

        function readSettings() {
            try {
                const savedSettings = Object.assign({}, defaultSettings, JSON.parse(localStorage.getItem(storageKey) || "{}"));
                savedSettings.fontSize = savedSettings.fontSize === "normal" ? "medium" : savedSettings.fontSize;
                return savedSettings;
            } catch (error) {
                return Object.assign({}, defaultSettings);
            }
        }

        function getSelectedSettings() {
            const selectedTheme = document.querySelector("input[name='theme']:checked");
            const selectedSize = document.querySelector(".size-btn.active");

            return {
                theme: selectedTheme ? selectedTheme.value : defaultSettings.theme,
                fontSize: selectedSize ? selectedSize.dataset.size : defaultSettings.fontSize
            };
        }

        function applySettings(settings) {
            const nextSettings = {
                theme: settings.theme === "dark" ? "dark" : "light",
                fontSize: settings.fontSize === "normal" ? "medium" : settings.fontSize
            };

            document.documentElement.classList.toggle("fc-theme-dark", nextSettings.theme === "dark");
            document.documentElement.classList.toggle("fc-font-small", nextSettings.fontSize === "small");
            document.documentElement.classList.toggle("fc-font-large", nextSettings.fontSize === "large");
            document.documentElement.style.colorScheme = nextSettings.theme === "dark" ? "dark" : "light";

            themeRadios.forEach(function (radio) {
                radio.checked = radio.value === nextSettings.theme;
            });

            sizeButtons.forEach(function (button) {
                const buttonSize = button.dataset.size === "normal" ? "medium" : button.dataset.size;
                button.classList.toggle("active", buttonSize === nextSettings.fontSize);
            });

            return nextSettings;
        }

        function saveAndApply(settings) {
            const nextSettings = applySettings(settings);
            localStorage.setItem(storageKey, JSON.stringify(nextSettings));

            if (window.FindCampusDisplaySettings) {
                window.FindCampusDisplaySettings.apply(nextSettings);
            }
        }

        themeRadios.forEach(function (radio) {
            radio.addEventListener("change", function () {
                saveAndApply(getSelectedSettings());
            });
        });

        sizeButtons.forEach(function (button) {
            button.addEventListener("click", function () {
                sizeButtons.forEach(function (btn) {
                    btn.classList.remove("active");
                });

                button.classList.add("active");
                saveAndApply(getSelectedSettings());
            });
        });

        applySettings(readSettings());

        saveBtn.addEventListener("click", function () {
            saveAndApply(getSelectedSettings());
            alert("화면 설정이 저장되었습니다.");
        });
    });
</script>

</body>

</html>

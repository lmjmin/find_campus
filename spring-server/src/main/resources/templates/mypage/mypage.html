<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>마이페이지 | FindCampus</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/mypage.css}">
</head>

<body>

<div th:replace="~{fragments/header :: header}"></div>

<div class="container mypage-main-container">

    <section class="profile-card mypage-profile-card">

        <div class="profile-left">

            <div class="profile-avatar">
                <span th:text="${loginUser != null and loginUser.userName != null and not #strings.isEmpty(loginUser.userName) ? #strings.substring(loginUser.userName, 0, 1) : '?'}">?</span>
            </div>

            <div class="profile-info">
                <h1 th:text="${loginUser != null ? loginUser.userName : '사용자'}">사용자</h1>
                <p>
                    <span th:text="${loginUser != null and loginUser.studentNo != null ? '학번 ' + loginUser.studentNo : '동명대학교 사용자'}">동명대학교 사용자</span>
                </p>
            </div>

        </div>

        <a th:href="@{/mypage/edit}" class="edit-btn">
            <i class="fa-solid fa-pen"></i>
            정보 수정
        </a>

    </section>

    <section class="stats">

        <div class="stat-card">
            <strong th:text="${(lostItems != null ? #lists.size(lostItems) : 0) + (foundItems != null ? #lists.size(foundItems) : 0)}">0</strong>
            <span>등록한 글</span>
        </div>

        <div class="stat-card">
            <strong th:text="${lostItems != null ? #lists.size(lostItems) : 0}">0</strong>
            <span>분실물</span>
        </div>

        <div class="stat-card">
            <strong th:text="${foundItems != null ? #lists.size(foundItems) : 0}">0</strong>
            <span>습득물</span>
        </div>

        <div class="stat-card">
            <strong th:text="${(lostItems != null ? #lists.size(lostItems) : 0) + (foundItems != null ? #lists.size(foundItems) : 0)}">0</strong>
            <span>전체</span>
        </div>

    </section>

    <section class="layout mypage-layout">

        <aside class="side-card">

            <a href="#" class="menu-item active">
                <div class="menu-left">
                    <div class="menu-icon">
                        <i class="fa-solid fa-list"></i>
                    </div>

                    <div class="menu-text">
                        <strong>내 게시글</strong>
                        <span>등록한 분실물/습득물 관리</span>
                    </div>
                </div>

                <i class="fa-solid fa-chevron-right"></i>
            </a>

            <a th:href="@{/notification}" class="menu-item">
                <div class="menu-left">
                    <div class="menu-icon">
                        <i class="fa-regular fa-bell"></i>
                    </div>

                    <div class="menu-text">
                        <strong>알림</strong>
                        <span>새 알림과 공지 확인</span>
                    </div>
                </div>

                <i class="fa-solid fa-chevron-right"></i>
            </a>

            <a th:href="@{/recommend}" class="menu-item">
                <div class="menu-left">
                    <div class="menu-icon">
                        <i class="fa-solid fa-wand-magic-sparkles"></i>
                    </div>

                    <div class="menu-text">
                        <strong>AI 서비스</strong>
                        <span>AI 매칭 결과 확인</span>
                    </div>
                </div>

                <i class="fa-solid fa-chevron-right"></i>
            </a>

            <a th:href="@{/mypage/setting}" class="menu-item">
                <div class="menu-left">
                    <div class="menu-icon">
                        <i class="fa-solid fa-gear"></i>
                    </div>

                    <div class="menu-text">
                        <strong>설정</strong>
                        <span>앱 설정 및 계정 관리</span>
                    </div>
                </div>

                <i class="fa-solid fa-chevron-right"></i>
            </a>

            <a th:href="@{/logout}" class="logout">
                <i class="fa-solid fa-right-from-bracket"></i>
                로그아웃
            </a>

        </aside>

        <main class="content-card">

            <div class="section-head">
                <h2>내 등록글 관리</h2>

                <div class="write-actions">
                    <a th:href="@{/lost/write}" class="write-btn write-lost">
                        분실물 등록
                    </a>

                    <a th:href="@{/found/write}" class="write-btn write-found">
                        습득물 등록
                    </a>
                </div>
            </div>

            <div class="tabs">
                <button type="button" class="tab active" data-post-filter="all" th:text="${'전체 ' + ((lostItems != null ? #lists.size(lostItems) : 0) + (foundItems != null ? #lists.size(foundItems) : 0))}">전체 0</button>
                <button type="button" class="tab" data-post-filter="lost" th:text="${'분실물 ' + (lostItems != null ? #lists.size(lostItems) : 0)}">분실물 0</button>
                <button type="button" class="tab" data-post-filter="found" th:text="${'습득물 ' + (foundItems != null ? #lists.size(foundItems) : 0)}">습득물 0</button>
            </div>

            <div class="post-list">

                <div th:if="${(lostItems == null or #lists.isEmpty(lostItems)) and (foundItems == null or #lists.isEmpty(foundItems))}" class="mypage-empty">
                    등록한 글이 없습니다.
                </div>

                <div class="mypage-empty post-filter-empty" hidden>
                    선택한 종류의 게시글이 없습니다.
                </div>

                <div class="post-card" data-post-type="lost" th:each="item : ${lostItems}">

                    <div class="post-thumb lost-thumb">
                        <span class="status-badge"
                              th:classappend="${item.status == 'RETURNED' ? ' status-returned' : (item.status == 'STORED' ? ' status-storage' : ' status-received')}"
                              th:text="${item.status == 'REGISTERED' ? '접수중' : (item.status == 'STORED' ? '보관중' : (item.status == 'RETURNED' ? '반환완료' : item.status))}">접수중</span>
                        <img th:if="${item.imageUrl != null}" th:src="@{${item.imageUrl}}" alt="분실물 사진" class="post-photo"><i th:if="${item.imageUrl == null}" class="fa-solid fa-box-open"></i>
                    </div>

                    <div class="post-info">
                        <span class="post-type lost">분실물</span>

                        <div class="post-title" th:text="${item.title}">분실물 제목</div>

                        <div class="post-desc" th:text="${item.itemName + (item.color != null and item.color != '' ? ' · ' + item.color : '') + (item.brand != null and item.brand != '' ? ' · ' + item.brand : '')}">item summary</div>

                        <div class="post-meta">
                            <span><i class="fa-solid fa-location-dot"></i> <span th:text="${item.locationName != null ? item.locationName : '위치 미입력'}">위치</span></span>
                            <span><i class="fa-regular fa-calendar"></i> <span th:text="${item.createdAt != null ? #dates.format(item.createdAt, 'yyyy.MM.dd') : ''}">날짜</span></span>
                            <span><i class="fa-regular fa-eye"></i> <span th:text="${item.viewCount}">0</span></span>
                        </div>
                    </div>

                    <div class="post-actions">
                        <a th:href="@{/lost/edit/{id}(id=${item.id})}" class="action-btn edit">수정</a>
                        <form th:action="@{/lost/delete/{id}(id=${item.id})}" method="post">
                            <button type="submit" class="action-btn delete" onclick="return confirm('삭제하시겠습니까?')">삭제</button>
                        </form>
                    </div>

                </div>

                <div class="post-card" data-post-type="found" th:each="item : ${foundItems}">

                    <div class="post-thumb found-thumb">
                        <span class="status-badge"
                              th:classappend="${item.status == 'RETURNED' ? ' status-returned' : (item.status == 'STORED' ? ' status-storage' : ' status-received')}"
                              th:text="${item.status == 'REGISTERED' ? '접수중' : (item.status == 'STORED' ? '보관중' : (item.status == 'RETURNED' ? '반환완료' : item.status))}">보관중</span>
                        <img th:if="${item.imageUrl != null}" th:src="@{${item.imageUrl}}" alt="습득물 사진" class="post-photo"><i th:if="${item.imageUrl == null}" class="fa-solid fa-box-open"></i>
                    </div>

                    <div class="post-info">
                        <span class="post-type found">습득물</span>

                        <div class="post-title" th:text="${item.title}">습득물 제목</div>

                        <div class="post-desc" th:text="${item.itemName + (item.color != null and item.color != '' ? ' · ' + item.color : '') + (item.brand != null and item.brand != '' ? ' · ' + item.brand : '')}">item summary</div>

                        <div class="post-meta">
                            <span><i class="fa-solid fa-location-dot"></i> <span th:text="${item.locationName != null ? item.locationName : '위치 미입력'}">위치</span></span>
                            <span><i class="fa-regular fa-calendar"></i> <span th:text="${item.createdAt != null ? #dates.format(item.createdAt, 'yyyy.MM.dd') : ''}">날짜</span></span>
                            <span><i class="fa-regular fa-eye"></i> <span th:text="${item.viewCount}">0</span></span>
                        </div>
                    </div>

                    <div class="post-actions">
                        <a th:href="@{/found/edit/{id}(id=${item.id})}" class="action-btn edit">수정</a>
                        <form th:action="@{/found/delete/{id}(id=${item.id})}" method="post">
                            <button type="submit" class="action-btn delete" onclick="return confirm('삭제하시겠습니까?')">삭제</button>
                        </form>
                    </div>

                </div>

            </div>

        </main>

    </section>

    <footer>
        FindCampus v1.0.0 · 동명대학교
    </footer>

</div>

<script>
    document.addEventListener("DOMContentLoaded", function () {
        const tabs = document.querySelectorAll(".tabs .tab");
        const posts = document.querySelectorAll(".post-card[data-post-type]");
        const filterEmpty = document.querySelector(".post-filter-empty");

        tabs.forEach(function (tab) {
            tab.addEventListener("click", function () {
                const filter = tab.dataset.postFilter;
                let visibleCount = 0;

                tabs.forEach(function (item) {
                    item.classList.remove("active");
                });
                tab.classList.add("active");

                posts.forEach(function (post) {
                    const visible = filter === "all" || post.dataset.postType === filter;
                    post.hidden = !visible;
                    if (visible) visibleCount += 1;
                });

                if (filterEmpty) {
                    filterEmpty.hidden = visibleCount !== 0;
                }
            });
        });
    });
</script>
<script>
document.addEventListener("DOMContentLoaded", function () {
    const tabs = document.querySelectorAll(".mypage-main-container .tabs .tab");
    const posts = document.querySelectorAll(".mypage-main-container .post-card[data-post-type]");
    const postList = document.querySelector(".mypage-main-container .post-list");

    if (!tabs.length || !posts.length) return;

    function applyPostFilter(filter) {
        posts.forEach(function (post) {
            const show = filter === "all" || post.dataset.postType === filter;
            post.hidden = !show;
            post.classList.toggle("is-filter-hidden", !show);
        });

        if (postList) {
            postList.scrollTop = 0;
        }
    }

    tabs.forEach(function (tab) {
        tab.addEventListener("click", function (event) {
            event.preventDefault();
            const filter = tab.dataset.postFilter || "all";

            tabs.forEach(function (item) {
                item.classList.remove("active");
            });
            tab.classList.add("active");

            applyPostFilter(filter);
        });
    });

    const activeTab = document.querySelector(".mypage-main-container .tabs .tab.active") || tabs[0];
    applyPostFilter(activeTab.dataset.postFilter || "all");
});
</script>
</body>
</html>

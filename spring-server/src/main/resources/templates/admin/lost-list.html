<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>분실물 관리 | FindCampus Admin</title><meta name="viewport" content="width=device-width, initial-scale=1.0"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"><link rel="stylesheet" th:href="@{/css/admin.css}"></head>
<body><div class="admin-page"><header class="admin-header"><a th:href="@{/admin/dashboard}" class="admin-logo"><span class="admin-logo-icon"><i class="fa-solid fa-magnifying-glass-location"></i></span><span>FindCampus Admin</span></a><div class="admin-header-right"><span><i class="fa-regular fa-user"></i> 관리자</span><a th:href="@{/admin/login}" class="logout-btn">로그아웃</a></div></header><div class="admin-layout"><aside class="sidebar"><div class="sidebar-title">메뉴</div><nav class="side-menu"><a th:href="@{/admin/dashboard}" class="side-link"><i class="fa-solid fa-chart-line"></i>대시보드</a><a th:href="@{/admin/users}" class="side-link"><i class="fa-solid fa-users"></i>사용자 관리</a><a th:href="@{/admin/lost}" class="side-link active"><i class="fa-solid fa-circle-question"></i>분실물 관리</a><a th:href="@{/admin/found}" class="side-link"><i class="fa-solid fa-box-open"></i>습득물 관리</a><a th:href="@{/admin/storage}" class="side-link"><i class="fa-solid fa-warehouse"></i>보관 장소 관리</a><a th:href="@{/admin/locations}" class="side-link"><i class="fa-solid fa-location-dot"></i>위치 관리</a><a th:href="@{/admin/categories}" class="side-link"><i class="fa-solid fa-tags"></i>카테고리 관리</a><a th:href="@{/admin/reports}" class="side-link"><i class="fa-solid fa-triangle-exclamation"></i>신고 관리</a><a th:href="@{/admin/inquiries}" class="side-link"><i class="fa-solid fa-headset"></i>문의 관리</a>

                <a th:href="@{/admin/notifications}" class="side-link">
                    <i class="fa-regular fa-bell"></i>
                    알림 관리
                </a></nav><div class="admin-user-link-box"><a th:href="@{/}" href="/" class="admin-user-link" onclick="window.location.href='/'; return false;"><i class="fa-solid fa-house"></i><span>사용자 페이지로 이동</span></a></div></aside><main class="admin-content"><div class="page-title-wrap"><h1 class="page-title">분실물 관리</h1><p class="page-desc">등록된 분실물 게시글의 노출과 상태를 관리합니다.</p></div><section class="summary-grid"><div class="summary-card"><div class="summary-top"><div class="summary-label">전체 분실물</div><div class="summary-icon total"><i class="fa-solid fa-circle-question"></i></div></div><div class="summary-count"><span th:text="${totalCount}">0</span><span>건</span></div><div class="summary-sub">숨김 포함 전체</div></div><div class="summary-card"><div class="summary-top"><div class="summary-label">접수중</div><div class="summary-icon waiting"><i class="fa-solid fa-hourglass-half"></i></div></div><div class="summary-count"><span th:text="${registeredCount}">0</span><span>건</span></div><div class="summary-sub">사용자 화면 접수중</div></div><div class="summary-card"><div class="summary-top"><div class="summary-label">반환완료</div><div class="summary-icon done"><i class="fa-solid fa-circle-check"></i></div></div><div class="summary-count"><span th:text="${returnedCount}">0</span><span>건</span></div><div class="summary-sub">수령 완료</div></div><div class="summary-card"><div class="summary-top"><div class="summary-label">숨김</div><div class="summary-icon hidden"><i class="fa-solid fa-eye-slash"></i></div></div><div class="summary-count"><span th:text="${hiddenCount}">0</span><span>건</span></div><div class="summary-sub">사용자 화면 미노출</div></div></section><section class="filter-panel"><form class="filter-row" th:action="@{/admin/lost}" method="get"><div class="search-box"><i class="fa-solid fa-magnifying-glass"></i><input type="text" name="keyword" th:value="${search.keyword}" placeholder="물품명, 작성자, 위치로 검색"></div><div class="filter-actions"><select class="filter-select" name="categoryId"><option value="">카테고리 전체</option><option th:each="category : ${categories}" th:value="${category.categoryId}" th:selected="${search.categoryId == category.categoryId}" th:text="${category.categoryName}">카테고리</option></select><select class="filter-select" name="status"><option value="">상태 전체</option><option value="REGISTERED" th:selected="${search.status == 'REGISTERED'}">접수중</option><option value="RETURNED" th:selected="${search.status == 'RETURNED'}">반환완료</option><option value="HIDDEN" th:selected="${search.status == 'HIDDEN'}">숨김</option></select><button type="submit" class="search-btn">검색</button></div></form></section><section class="table-panel"><div class="table-head"><h2 class="table-title">분실물 목록</h2><div class="table-count" th:text="|총 ${totalCount}건|">총 0건</div></div><table class="lost-table"><thead><tr><th>번호</th><th>구분</th><th>물품명</th><th>카테고리</th><th>분실 위치</th><th>작성자</th><th>등록일</th><th>상태</th><th>관리</th></tr></thead><tbody><tr th:if="${#lists.isEmpty(items)}"><td colspan="9" class="empty-cell">등록된 분실물이 없습니다.</td></tr><tr th:each="item, stat : ${items}" class="clickable-row" th:attr="data-href=@{/lost/detail/{id}(id=${item.id})}"><td th:text="${stat.count}">1</td><td><span class="type-badge lost">분실물</span></td><td><div class="item-name" th:text="${item.title}">제목</div><div class="item-desc" th:text="${item.itemName}">물건명</div></td><td><span class="category-badge" th:text="${item.categoryName != null ? item.categoryName : '-'}">-</span></td><td th:text="${item.locationName != null ? item.locationName : '-'}">-</td><td th:text="${item.writerName != null ? item.writerName : '-'}">-</td><td th:text="${item.createdAt != null ? #dates.format(item.createdAt, 'yyyy.MM.dd') : '-'}">-</td><td><span class="status-badge" th:classappend="${item.status == 'HIDDEN' ? ' hidden' : (item.status == 'RETURNED' ? ' done' : ' waiting')}" th:text="${item.status == 'HIDDEN' ? '숨김' : (item.status == 'RETURNED' ? '반환완료' : '접수중')}">접수중</span></td><td><form class="status-change-form" th:action="@{/admin/lost/status}" method="post"><input type="hidden" name="lostId" th:value="${item.id}"><select class="admin-status-select" name="status" aria-label="분실물 상태 변경"><option value="REGISTERED" th:selected="${item.status == 'REGISTERED' or item.status == 'RECEIVED'}">접수중</option><option value="RETURNED" th:selected="${item.status == 'RETURNED' or item.status == 'COMPLETED'}">반환완료</option><option value="HIDDEN" th:selected="${item.status == 'HIDDEN'}">숨김</option></select><button type="submit" class="action-btn status-save-btn">변경</button></form></td></tr></tbody></table></section></main></div></div><script>
    document.addEventListener("click", function (event) {
        if (event.target.closest(".action-group, button, a, input, select, textarea, label")) {
            return;
        }

        const row = event.target.closest(".clickable-row");
        if (!row || !row.dataset.href) {
            return;
        }

        window.location.href = row.dataset.href;
    });
</script>
</body></html>

<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>위치 관리 | FindCampus Admin</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>
<div class="admin-page">
    <header class="admin-header"><a th:href="@{/admin/dashboard}" class="admin-logo"><span class="admin-logo-icon"><i class="fa-solid fa-magnifying-glass-location"></i></span><span>FindCampus Admin</span></a><div class="admin-header-right"><span><i class="fa-regular fa-user"></i> 관리자</span><a th:href="@{/admin/login}" class="logout-btn">로그아웃</a></div></header>
    <div class="admin-layout">
        <aside class="sidebar"><div class="sidebar-title">메뉴</div><nav class="side-menu"><a th:href="@{/admin/dashboard}" class="side-link"><i class="fa-solid fa-chart-line"></i>대시보드</a><a th:href="@{/admin/users}" class="side-link"><i class="fa-solid fa-users"></i>사용자 관리</a><a th:href="@{/admin/lost}" class="side-link"><i class="fa-solid fa-circle-question"></i>분실물 관리</a><a th:href="@{/admin/found}" class="side-link"><i class="fa-solid fa-box-open"></i>습득물 관리</a><a th:href="@{/admin/storage}" class="side-link"><i class="fa-solid fa-warehouse"></i>보관 장소 관리</a><a th:href="@{/admin/locations}" class="side-link active"><i class="fa-solid fa-location-dot"></i>위치 관리</a><a th:href="@{/admin/categories}" class="side-link"><i class="fa-solid fa-tags"></i>카테고리 관리</a><a th:href="@{/admin/reports}" class="side-link"><i class="fa-solid fa-triangle-exclamation"></i>신고 관리</a><a th:href="@{/admin/inquiries}" class="side-link"><i class="fa-solid fa-headset"></i>문의 관리</a>

                <a th:href="@{/admin/notifications}" class="side-link">
                    <i class="fa-regular fa-bell"></i>
                    알림 관리
                </a></nav><div class="admin-user-link-box"><a th:href="@{/}" href="/" class="admin-user-link" onclick="window.location.href='/'; return false;"><i class="fa-solid fa-house"></i><span>사용자 페이지로 이동</span></a></div></aside>
        <main class="admin-content"><div th:if="${message}" class="admin-alert success" th:text="${message}"></div><div th:if="${error}" class="admin-alert error" th:text="${error}"></div>
            <div class="page-title-wrap"><h1 class="page-title">위치 관리</h1><p class="page-desc">사용자 등록, 검색, 지도 필터에 노출되는 교내 위치를 관리합니다.</p></div>
            <section class="summary-grid"><div class="summary-card"><div class="summary-top"><div class="summary-label">전체 위치</div><div class="summary-icon total"><i class="fa-solid fa-location-dot"></i></div></div><div class="summary-count"><span th:text="${totalCount}">0</span><span>곳</span></div><div class="summary-sub">등록된 전체 위치</div></div><div class="summary-card"><div class="summary-top"><div class="summary-label">사용중</div><div class="summary-icon active"><i class="fa-solid fa-circle-check"></i></div></div><div class="summary-count"><span th:text="${activeCount}">0</span><span>곳</span></div><div class="summary-sub">사용자 화면에 표시</div></div></section>
            <section class="manage-grid">
                <form class="form-panel" th:action="@{/admin/locations/save}" method="post">
                    <div class="panel-head"><h2 class="panel-title" th:text="${editLocation != null ? '위치 수정' : '위치 등록'}">위치 등록</h2></div>
                    <div class="form-body">
                        <input type="hidden" name="locationId" th:value="${editLocation != null ? editLocation.locationId : ''}">
                        <div class="form-group"><label for="locationName">위치명</label><input type="text" id="locationName" name="locationName" th:value="${editLocation != null ? editLocation.locationName : ''}" placeholder="예: 중앙도서관" required></div>
                        <div class="form-group"><label for="latitude">위도</label><input type="number" step="0.0000000001" id="latitude" name="latitude" th:value="${editLocation != null ? editLocation.latitude : ''}" placeholder="지도 좌표가 필요할 때만 입력"></div>
                        <div class="form-group"><label for="longitude">경도</label><input type="number" step="0.0000000001" id="longitude" name="longitude" th:value="${editLocation != null ? editLocation.longitude : ''}" placeholder="지도 좌표가 필요할 때만 입력"></div>
                        <p class="form-help">등록 시 사용 여부는 자동으로 사용중 처리됩니다. 중지는 오른쪽 목록에서 처리하세요.</p>
                        <button type="submit" class="submit-btn" th:text="${editLocation != null ? '위치 수정' : '위치 등록'}">위치 등록</button>
                    </div>
                </form>
                <div class="table-panel"><div class="panel-head"><h2 class="panel-title">위치 목록</h2></div><table class="location-table"><thead><tr><th>번호</th><th>위치명</th><th>좌표</th><th>상태</th><th>관리</th></tr></thead><tbody><tr th:if="${#lists.isEmpty(locations)}"><td colspan="5" class="empty-cell">등록된 위치가 없습니다.</td></tr><tr th:each="location, stat : ${locations}"><td th:text="${stat.count}">1</td><td><div class="location-name" th:text="${location.locationName}">위치명</div></td><td><span th:text="${location.latitude != null and location.longitude != null ? location.latitude + ', ' + location.longitude : '-'}">-</span></td><td><span class="status-badge" th:classappend="${location.useYn == 'Y' ? ' active' : ' inactive'}" th:text="${location.useYn == 'Y' ? '사용중' : '사용안함'}">사용중</span></td><td><div class="action-group"><a th:href="@{/admin/locations(editId=${location.locationId})}" class="action-btn edit-btn">&#49688;&#51221;</a><form th:if="${location.useYn == 'Y'}" th:action="@{/admin/locations/status}" method="post"><input type="hidden" name="locationId" th:value="${location.locationId}"><input type="hidden" name="useYn" value="N"><button type="submit" class="action-btn stop-btn">&#51473;&#51648;</button></form><form th:if="${location.useYn != 'Y'}" th:action="@{/admin/locations/status}" method="post"><input type="hidden" name="locationId" th:value="${location.locationId}"><input type="hidden" name="useYn" value="Y"><button type="submit" class="action-btn restore-btn">&#49324;&#50857;</button></form><form th:action="@{/admin/locations/delete}" method="post" onsubmit="return confirm('\uC774 \uC704\uCE58\uB97C \uC0AD\uC81C\uD560\uAE4C\uC694?');"><input type="hidden" name="locationId" th:value="${location.locationId}"><button type="submit" class="action-btn delete-btn">&#49325;&#51228;</button></form></div></td></tr></tbody></table></div>
            </section>
        </main>
    </div>
</div>
</body>
</html>

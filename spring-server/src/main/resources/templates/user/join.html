<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>회원가입 | FindCampus</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/user.css}">
</head>

<body>

<div class="join-container">
    <div class="left-section">
        <div class="logo">
            <div class="logo-icon">
                <i class="fa-solid fa-magnifying-glass-location"></i>
            </div>
            FindCampus
        </div>

        <h1>
            동명대학교<br>
            학생 전용 서비스
        </h1>

        <p>
            학교 구성원들과 함께<br>
            안전하고 빠르게 분실물을 찾아보세요.
        </p>
    </div>

    <div class="right-section">
        <div class="form-title">회원가입</div>
        <div class="form-subtitle">학번으로 계정을 생성합니다.</div>

        <form id="joinForm">
            <div class="input-group">
                <label>이름</label>
                <div class="input-box">
                    <i class="fa-solid fa-user"></i>
                    <input type="text" id="userName" name="userName" placeholder="이름을 입력하세요">
                </div>
            </div>

            <div class="input-group">
                <label>학번</label>
                <div class="input-box">
                    <i class="fa-solid fa-id-card"></i>
                    <input type="text" id="studentNo" name="studentNo" placeholder="학번을 입력하세요">
                </div>
            </div>

            <div class="input-group">
                <label>휴대폰 번호</label>
                <div class="input-box">
                    <i class="fa-solid fa-phone"></i>
                    <input type="text" id="phone" name="phone" placeholder="010-0000-0000">
                </div>
            </div>

            <div class="input-group">
                <label>비밀번호</label>
                <div class="input-box">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="password" name="password" placeholder="4자 이상 입력하세요">
                </div>
            </div>

            <div class="input-group">
                <label>비밀번호 확인</label>
                <div class="input-box">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="passwordCheck" name="passwordCheck" placeholder="비밀번호를 다시 입력하세요">
                </div>
            </div>

            <div class="checkbox-wrap">
                <input type="checkbox" id="agree">
                <label for="agree">이용약관 및 개인정보처리방침에 동의합니다.</label>
            </div>

            <p id="joinError" class="error-message"></p>

            <button type="submit" class="join-btn">회원가입 완료</button>
        </form>

        <div class="bottom-text">
            이미 계정이 있으신가요?
            <a th:href="@{/login}">로그인</a>
        </div>
    </div>
</div>

<script>
    const joinForm = document.getElementById("joinForm");
    const joinError = document.getElementById("joinError");

    function showJoinError(message) {
        joinError.style.display = "block";
        joinError.textContent = message;
    }

    joinForm.addEventListener("submit", async function (event) {
        event.preventDefault();

        const userName = document.getElementById("userName").value.trim();
        const studentNo = document.getElementById("studentNo").value.trim();
        const phone = document.getElementById("phone").value.trim();
        const password = document.getElementById("password").value.trim();
        const passwordCheck = document.getElementById("passwordCheck").value.trim();
        const agree = document.getElementById("agree").checked;

        joinError.style.display = "none";
        joinError.textContent = "";

        if (!userName) {
            showJoinError("이름을 입력해 주세요.");
            return;
        }
        if (!studentNo) {
            showJoinError("학번을 입력해 주세요.");
            return;
        }
        if (!password) {
            showJoinError("비밀번호를 입력해 주세요.");
            return;
        }
        if (password !== passwordCheck) {
            showJoinError("비밀번호가 일치하지 않습니다.");
            return;
        }
        if (!agree) {
            showJoinError("이용약관 및 개인정보처리방침에 동의해 주세요.");
            return;
        }

        try {
            const response = await fetch("/api/join", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    loginId: studentNo,
                    password: password,
                    passwordCheck: passwordCheck,
                    userName: userName,
                    studentNo: studentNo,
                    phone: phone
                })
            });

            const result = await response.json();
            if (!response.ok || !result.success) {
                showJoinError(result.message || "회원가입에 실패했습니다.");
                return;
            }

            alert("회원가입이 완료되었습니다. 로그인해 주세요.");
            location.href = "/login";
        } catch (error) {
            showJoinError("회원가입 요청 중 오류가 발생했습니다.");
        }
    });
</script>

</body>
</html>

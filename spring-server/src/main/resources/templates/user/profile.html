<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>사용자 프로필 | FindCampus</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/profile.css}">
</head>

<body>

<div th:replace="~{fragments/header :: header}"></div>

<main class="profile-page">
    <section class="profile-container">

        <div class="profile-top-card">
            <button type="button" class="profile-back-btn" onclick="history.back()">
                <i class="fa-solid fa-arrow-left"></i>
                뒤로가기
            </button>

            <div class="profile-main-info">
                <div class="profile-avatar" id="profileAvatar">
                    <span id="profileInitial">김</span>
                </div>

                <div class="profile-user-text">
                    <div class="profile-name-row">
                        <h1 id="profileName">김동명</h1>
                        <span class="profile-department" id="profileDepartment">컴퓨터공학과</span>
                    </div>
                    <p id="profileIntro">분실물 확인을 위해 대화 중입니다.</p>

                    <div class="profile-meta-list">
                        <span>
                            <i class="fa-regular fa-clock"></i>
                            <em id="profileRecent">최근 대화 방금 전</em>
                        </span>
                        <span>
                            <i class="fa-solid fa-circle-check"></i>
                            동명대학교 사용자
                        </span>
                    </div>
                </div>
            </div>

            <div class="profile-action-area">
                <a th:href="@{/chat/room/1}" id="chatLink" class="profile-chat-btn">
                    <i class="fa-regular fa-comment-dots"></i>
                    채팅하기
                </a>
                <a th:href="@{/report}" class="profile-report-btn">
                    <i class="fa-regular fa-flag"></i>
                    신고하기
                </a>
            </div>
        </div>

        <div class="profile-summary-grid">
            <div class="profile-summary-card">
                <strong id="lostCount">2</strong>
                <span>등록한 분실글</span>
            </div>
            <div class="profile-summary-card">
                <strong id="foundCount">1</strong>
                <span>등록한 습득글</span>
            </div>
            <div class="profile-summary-card">
                <strong id="returnCount">3</strong>
                <span>반환 완료</span>
            </div>
        </div>

        <section class="profile-content-section">
            <div class="profile-section-title">
                <div>
                    <h2>최근 작성한 글</h2>
                    <p>이 사용자가 최근 등록한 분실물/습득물 글입니다.</p>
                </div>
            </div>

            <div class="profile-post-list" id="postList">
                <!-- JS에서 더미 게시글 렌더링 -->
            </div>
        </section>

    </section>
</main>

<script>

                {

                },
                {
                    type: "lost",
                    status: "반환완료",

                    location: "제1공학관",

                    desc: "강의실에 두고 온 텀블러를 찾았습니다."
                }
            ]
        },
        2: {

            initial: "이",
            department: "컴퓨터공학과",
            avatarClass: "profile-sky",
            intro: "학생회관 안내데스크 보관 관련 대화입니다.",
            recent: "최근 대화 14:47",
            lostCount: 1,
            foundCount: 2,
            returnCount: 2,
            chatRoomId: 2,
            posts: [
                {
                    type: "found",

                    date: "오늘",
                    desc: "파란색 파우치를 습득하여 학생회관 안내데스크에 맡겼습니다."
                },
                {
                    type: "found",
                    status: "반환완료",
                    title: "검은색 우산 습득",

                    date: "2일 전",
                    desc: "우산 보관함 근처에서 검은색 우산을 발견했습니다."
                }
            ]
        },

            initial: "박",

            returnCount: 1,
            chatRoomId: 4,
            posts: [

                },
                {

                }
            ]
        },
        5: {
            name: "장연옥",
            initial: "장",

            foundCount: 1,
            returnCount: 1,
            chatRoomId: 5,
            posts: [
                {
                    type: "lost",

                    title: "에어팟 케이스를 찾습니다",

                }
            ]

        6: {
            name: "오지훈",
            initial: "오",
            department: "간호학과",
            avatarClass: "profile-green",
            intro: "습득물 상세 페이지를 보고 시작된 대화입니다.",
            recent: "최근 대화 10:22",
            lostCount: 1,
            foundCount: 0,
            returnCount: 0,
            chatRoomId: 6,
            posts: [
                {
                    type: "lost",
                    status: "접수중",
                    title: "검은색 우산을 찾습니다",
                    location: "간호학관",
                    date: "오늘",
                    desc: "손잡이에 작은 표시가 있는 검은색 우산을 찾고 있습니다."
                }
            ]
        }
    };

    function getProfileIdFromPath() {
        const parts = window.location.pathname.split("/");
        const last = parts[parts.length - 1];
        return profiles[last] ? last : "1";
    }

    function escapeHtml(text) {
        return String(text)
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;")
            .replaceAll('"', "&quot;")
            .replaceAll("'", "&#039;");
    }

    function renderProfile() {
        const profileId = getProfileIdFromPath();
        const profile = profiles[profileId];

        const avatar = document.getElementById("profileAvatar");
        avatar.className = `profile-avatar ${profile.avatarClass}`;

        document.getElementById("profileInitial").textContent = profile.initial;
        document.getElementById("profileName").textContent = profile.name;
        document.getElementById("profileIntro").textContent = profile.intro;
        document.getElementById("profileRecent").textContent = profile.recent;
        document.getElementById("lostCount").textContent = profile.lostCount;
        document.getElementById("foundCount").textContent = profile.foundCount;
        document.getElementById("returnCount").textContent = profile.returnCount;

        const department = document.getElementById("profileDepartment");
        if (profile.department) {
            department.textContent = profile.department;
            department.style.display = "inline-flex";
        } else {
            department.style.display = "none";
        }

        document.getElementById("chatLink").setAttribute("href", `/chat/room/${profile.chatRoomId}`);

        const postList = document.getElementById("postList");
        let html = "";

        profile.posts.forEach(post => {
            const typeLabel = post.type === "lost" ? "분실물" : "습득물";
            const typeClass = post.type === "lost" ? "lost" : "found";

            html += `
                <a href="${post.type === "lost" ? "/lost/detail" : "/found/detail"}" class="profile-post-card">
                    <div class="profile-post-top">
                        <span class="profile-post-type ${typeClass}">${typeLabel}</span>
                        <span class="profile-post-status">${escapeHtml(post.status)}</span>
                    </div>
                    <h3>${escapeHtml(post.title)}</h3>
                    <p>${escapeHtml(post.desc)}</p>
                    <div class="profile-post-meta">
                        <span>
                            <i class="fa-solid fa-location-dot"></i>
                            ${escapeHtml(post.location)}
                        </span>
                        <span>
                            <i class="fa-regular fa-clock"></i>
                            ${escapeHtml(post.date)}
                        </span>
                    </div>
                </a>
            `;
        });

        postList.innerHTML = html;
    }

    renderProfile();
</script>

</body>
</html>

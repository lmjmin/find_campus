<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>사용자 프로필 | FindCampus</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/profile.css}">
</head>

<body>

<div th:replace="~{fragments/header :: header}"></div>

<main class="profile-page">
    <section class="profile-container">

        <div class="profile-top-card">
            <button type="button" class="profile-back-btn" onclick="history.back()">
                <i class="fa-solid fa-arrow-left"></i>
                뒤로가기
            </button>

            <div class="profile-main-info">
                <div class="profile-avatar profile-indigo" id="profileAvatar">
                    <span id="profileInitial"
                          th:text="${profileUser != null and profileUser.userName != null and not #strings.isEmpty(profileUser.userName) ? #strings.substring(profileUser.userName, 0, 1) : '?'}">?</span>
                </div>

                <div class="profile-user-text">
                    <div class="profile-name-row">
                        <h1 id="profileName" th:text="${profileUser != null ? profileUser.userName : '사용자'}">사용자</h1>
                        <span class="profile-department"
                              id="profileDepartment"
                              th:if="${profileUser != null and profileUser.studentNo != null}"
                              th:text="${profileUser.studentNo}">학번</span>
                    </div>
                    <p id="profileIntro">이 사용자가 등록한 분실물과 습득물 활동입니다.</p>

                    <div class="profile-meta-list">
                        <span>
                            <i class="fa-regular fa-clock"></i>
                            <em id="profileRecent" th:text="${profileUser != null and profileUser.createdAt != null ? '가입일 ' + #dates.format(profileUser.createdAt, 'yyyy.MM.dd') : '사용자 정보'}">사용자 정보</em>
                        </span>
                        <span>
                            <i class="fa-solid fa-circle-check"></i>
                            동명대학교 사용자
                        </span>
                    </div>
                </div>
            </div>

            <div class="profile-action-area">
                <a th:href="@{/chat/room/{id}(id=${userId})}" id="chatLink" class="profile-chat-btn">
                    <i class="fa-regular fa-comment-dots"></i>
                    채팅하기
                </a>
                <a th:href="@{/report}" class="profile-report-btn">
                    <i class="fa-regular fa-flag"></i>
                    신고하기
                </a>
            </div>
        </div>

        <div class="profile-summary-grid">
            <div class="profile-summary-card">
                <strong id="lostCount" th:text="${lostItems != null ? #lists.size(lostItems) : 0}">0</strong>
                <span>등록한 분실글</span>
            </div>
            <div class="profile-summary-card">
                <strong id="foundCount" th:text="${foundItems != null ? #lists.size(foundItems) : 0}">0</strong>
                <span>등록한 습득글</span>
            </div>
            <div class="profile-summary-card">
                <strong id="postCount"
                        th:text="${(lostItems != null ? #lists.size(lostItems) : 0) + (foundItems != null ? #lists.size(foundItems) : 0)}">0</strong>
                <span>전체 작성글</span>
            </div>
        </div>

        <section class="profile-content-section">
            <div class="profile-section-title">
                <div>
                    <h2>최근 작성한 글</h2>
                    <p>이 사용자가 최근 등록한 분실물/습득물 글입니다.</p>
                </div>
            </div>

            <div th:if="${(lostItems == null or #lists.isEmpty(lostItems)) and (foundItems == null or #lists.isEmpty(foundItems))}"
                 class="profile-empty">
                등록한 글이 없습니다.
            </div>

            <div class="profile-post-list" id="postList">
                <a th:each="item : ${lostItems}"
                   th:href="@{/lost/detail/{id}(id=${item.id})}"
                   class="profile-post-card profile-post-lost">
                    <div class="profile-post-top">
                        <span class="profile-post-type lost">분실물</span>
                        <span class="profile-post-status"
                              th:classappend="${item.status == 'RETURNED' ? ' returned' : (item.status == 'CLAIM_WAITING' ? ' waiting' : (item.status == 'HIDDEN' ? ' hidden' : ' registered'))}"
                              th:text="${item.status == 'RETURNED' ? '반환완료' : (item.status == 'CLAIM_WAITING' ? '처리대기' : (item.status == 'HIDDEN' ? '숨김' : '접수중'))}">접수중</span>
                    </div>
                    <h3 th:text="${item.title}">분실물 제목</h3>
                    <p th:text="${item.description}">분실물 설명</p>
                    <div class="profile-post-meta">
                        <span>
                            <i class="fa-solid fa-location-dot"></i>
                            <span th:text="${item.locationName != null ? item.locationName : '위치 미입력'}">위치</span>
                        </span>
                        <span>
                            <i class="fa-regular fa-clock"></i>
                            <span th:text="${item.itemDate != null ? #dates.format(item.itemDate, 'yyyy.MM.dd') : '날짜 미입력'}">날짜</span>
                        </span>
                    </div>
                </a>

                <a th:each="item : ${foundItems}"
                   th:href="@{/found/detail/{id}(id=${item.id})}"
                   class="profile-post-card profile-post-found">
                    <div class="profile-post-top">
                        <span class="profile-post-type found">습득물</span>
                        <span class="profile-post-status"
                              th:classappend="${item.status == 'RETURNED' ? ' returned' : (item.status == 'CLAIM_WAITING' ? ' waiting' : (item.status == 'HIDDEN' ? ' hidden' : ' stored'))}"
                              th:text="${item.status == 'RETURNED' ? '반환완료' : (item.status == 'CLAIM_WAITING' ? '처리대기' : (item.status == 'HIDDEN' ? '숨김' : '보관중'))}">보관중</span>
                    </div>
                    <h3 th:text="${item.title}">습득물 제목</h3>
                    <p th:text="${item.description}">습득물 설명</p>
                    <div class="profile-post-meta">
                        <span>
                            <i class="fa-solid fa-location-dot"></i>
                            <span th:text="${item.locationName != null ? item.locationName : '위치 미입력'}">위치</span>
                        </span>
                        <span>
                            <i class="fa-regular fa-clock"></i>
                            <span th:text="${item.itemDate != null ? #dates.format(item.itemDate, 'yyyy.MM.dd') : '날짜 미입력'}">날짜</span>
                        </span>
                    </div>
                </a>
            </div>
        </section>

    </section>
</main>

</body>
</html>
